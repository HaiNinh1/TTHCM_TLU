<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.25rem;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}

.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stat{color:var(--mute);font-size:.9rem;margin-left:auto;font-variant-numeric:tabular-nums}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.meta{color:var(--mute);font-size:.85rem;margin-bottom:8px}
.q{font-size:1.1rem;font-weight:600;margin-bottom:16px}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin-bottom:9px;padding:11px 14px}
.opt b{color:var(--acc);flex:none}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok b{color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.bad b{color:var(--bad)}
.msg{min-height:1.6em;margin:10px 0 4px;font-weight:600}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.note{color:var(--mute);font-size:.9rem;border-left:3px solid var(--line);padding-left:10px;margin:6px 0}
.nav{display:flex;gap:8px;margin-top:12px}
.nav .next{margin-left:auto;background:var(--acc);border-color:var(--acc);color:#fff}
.hint{color:var(--mute);font-size:.85rem;margin-top:14px}
.done h2{margin:0 0 8px}
.done li{margin-bottom:6px}
</style>

<script>
const ALL = [{"src": "Trắc nghiệm 302 câu – Câu 11", "ch": 4, "q": "Điền từ hoặc cụm từ đúng vào dấu […]: Đối với cán bộ, đảng viên, Hồ Chí Minh nhấn mạnh: “Trước mặt quần chúng, không phải ta cứ viết lên trán chữ […] mà ta được họ yêu mến. Quần chúng chỉ quý mến những người có […]”", "o": ["“Liêm khiết”, đạo đức", "“Cộng sản”, tư cách, đạo đức", "“Cộng sản”, đạo đức cách mạng", "“Liêm chính”, đạo đức cách mạng"], "a": 1, "note": [], "n": 1}, {"src": "Trắc nghiệm 302 câu – Câu 14", "ch": 4, "q": "Điền từ hoặc cụm từ đúng vào dấu […]: “Chế độ ta là chế độ dân chủ, tư tưởng phải được tự do. Tự do là thế nào? Đối với mọi vấn đề, mọi người tự do bày tỏ ý kiến của mình, góp phần tìm ra […]”", "o": ["Nguyên tắc", "Lý lẽ", "Chân lý", "Thực tiễn"], "a": 2, "note": [], "n": 2}, {"src": "Trắc nghiệm 302 câu – Câu 70", "ch": 4, "q": "Theo Hồ Chí Minh: “Sức mạnh vô địch của Đảng là ở tinh thần kỷ luật tự giác, ý thức tổ chức nghiêm chỉnh của cán bộ, đảng viên”. Câu nói trên Người dề cập đến nguyên tắc nào trong xây dựng Đảng sau đây?", "o": ["Tập thể lãnh đạo, cá nhân phụ trách", "Tự phê bình và phê bình", "Đoàn kết thống nhất trong Đảng", "Kỷ luật nghiêm minh, tự giác"], "a": 3, "note": [], "n": 3}, {"src": "Trắc nghiệm 302 câu – Câu 71", "ch": 4, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Đảng có vững, [...] mới thành công, cũng như người cầm lái có vững thì [...]”.", "o": ["Cách mệnh, thuyền mới chạy", "Kháng chiến, tàu mới chạy", "Cách mạng, tàu mới đi", "Cách mệnh, thuyền chạy"], "a": 0, "note": [], "n": 4}, {"src": "Trắc nghiệm 302 câu – Câu 72", "ch": 4, "q": "Tác phẩm nào sau đây của Hồ Chí Minh đề cập đến giáo dục, rèn luyện toàn diện đội ngũ cán bộ cách mạng của Đảng, của Nhà nước ta, được xuất bản năm 1947?", "o": ["Bản án chế độ thực dân Pháp", "Con đường dẫn tôi đến Chủ nghĩa Mác- Lênin", "Sửa đổi lối làm việc", "Đường Cách mệnh"], "a": 2, "note": [], "n": 5}, {"src": "Trắc nghiệm 302 câu – Câu 95", "ch": 4, "q": "Trong mấy điểm lớn trong Chính sách cán bộ, (Phần Vấn đề cán bộ, tác phẩm Sửa đổi lối làm việc), theo Hồ Chí Minh cần phải chú ý những gì?", "o": ["Hiểu biết cán bộ khéo dùng cán bộ, cất nhắc cán bộ, thương yêu cán bộ, phê bình cán bộ.", "Khéo dùng cán bộ, cất nhắc cán bộ.", "Hiểu biết cán bộ.", "Thương yêu và phê bình cán bộ."], "a": 0, "note": [], "n": 6}, {"src": "Trắc nghiệm 302 câu – Câu 97", "ch": 4, "q": "Theo Hồ Chí Minh, mục đích của phê bình và tự phê bình là gì?", "o": ["Cốt để giúp nhau sửa chữa, giúp nhau tiến bộ. Cốt để đổi cách làm việc cho tốt hơn, đúng hơn. Cốt để đoàn kết và thống nhất nội bộ.", "Thêm bớt khuyết điểm của nhau.", "Giấu giếm khuyết điểm cho nhau.", "Nịnh người trên, xem khinh người dưới."], "a": 0, "note": [], "n": 7}, {"src": "Trắc nghiệm 302 câu – Câu 98", "ch": 4, "q": "Đâu là nhân tố thể hiện sự sáng tạo của Hồ Chí Minh trong quy luật ra đời của Đảng Cộng sản Việt Nam.", "o": ["Phong trào công nhân.", "Tất cả phương án.", "Phong trào yêu nước.", "Chủ nghĩa Mác Lênin."], "a": 2, "note": [], "n": 8}, {"src": "Trắc nghiệm 302 câu – Câu 112", "ch": 4, "q": "Trong các nguyên tắc xây dựng Đảng, nguyên tắc nào là cơ bản trong xây dựng, tổ chức, hoạt động của Đảng, theo Hồ Chí Minh?", "o": ["Tự phê bình và phê bình.", "Tập thể lãnh đạo, cá nhân phụ trách.", "Kỷ luật nghiêm minh tự giác.", "Tập trung dân chủ."], "a": 3, "note": [], "n": 9}, {"src": "Trắc nghiệm 302 câu – Câu 133", "ch": 4, "q": "Trong tác phẩm “Sửa đổi lối làm việc”, phần Vấn đề cán bộ, theo Hồ Chí Minh, kinh nghiệm các nước và ở nước ta phải kiên quyết chống lại những bệnh nào trong công tác, trong Đảng?", "o": ["Bệnh tham ô, tham nhũng.", "Bệnh thoái hóa biến chất của cán bộ Đảng viên.", "Bệnh chủ quan, bệnh hẹp hòi, bệnh ba hoa.", "Bệnh mất đoàn kết chia rẻ nội bộ."], "a": 2, "note": [], "n": 10}, {"src": "Trắc nghiệm 302 câu – Câu 144", "ch": 4, "q": "Đảng Cộng sản Việt Nam do Hồ Chí Minh sáng lập và rèn luyện, hoạt động vì lợi ích của ai?", "o": ["Giai cấp công nhân, nhân dân lao động và của cả dân tộc Việt Nam." Chí Minh, “Là người đầy tớ của dân”, có nghĩa là phải?", "o": ["Thực hiện theo yêu cầu của quần chúng.", "Luôn lắng nghe và thực hiện theo yêu cầu của quần chúng.", "Tận tâm, tận lực phụng sự nhân dân nhằm đem lại các quyền lợi và lợi ích cho nhân dân.", "Luôn nghe theo quần chúng."], "a": 2, "note": [], "n": 41}, {"src": "Trắc nghiệm 302 câu – Câu 110", "ch": 5, "q": "Trong tác phẩm “Chính phủ là công bộc của dân”, theo Chủ tịch Hồ Chí Minh, các công việc mà Chính phủ làm phải nhằm vào mục đích gì?", "o": ["Mưu cầu hạnh phúc cho mọi người.", "Mưu cầu tự do hạnh phúc và việc làm cho mọi người.", "Mưu cầu tự do cho mọi người.", "Mưu cầu tự do, hạnh phúc cho mọi người."], "a": 3, "note": [], "n": 42}, {"src": "Trắc nghiệm 302 câu – Câu 113", "ch": 5, "q": "Theo Hồ Chí Minh, thước đo một Nhà nước vì dân là phải được lòng dân. Do đó, với cán bộ nhà nước phải:", "o": ["Gần gũi nhân dân khi cần.", "Giáo huấn nhân dân.", "Làm sao cho được lòng dân, dân tin, dân mến, dân yêu.", "Quan cách trước dân."], "a": 2, "note": [], "n": 43}, {"src": "Trắc nghiệm 302 câu – Câu 138", "ch": 5, "q": "Tìm phương án SAI trong các quan điểm sau của Hồ Chí Minh về Nhà nước thượng tôn pháp luật.", "o": ["Đề cao tính tự giác của con người.", "Chú trọng đưa pháp luật vào trong cuộc sống.", "Đảm bảo cho pháp luật được thi hành và có cơ chế giám sát việc thi hành pháp luật.", "Nêu cao tính nghiêm minh của pháp luật."], "a": 0, "note": [], "n": 44}, {"src": "Trắc nghiệm 302 câu – Câu 140", "ch": 5, "q": "Tìm phương án SAI trong quan điểm của Hồ Chí Minh về Nhà nước của dân.", "o": ["Nhà nước lấy lợi ích chính đáng của dân làm mục tiêu.", "Quyền lực nhà nước là “thừa ủy quyền” của nhân dân.", "Tất cả phương án.", "Quyền lực của nhà nước và xã hội thuộc về nhân dân."], "a": 0, "note": [], "n": 45}, {"src": "Trắc nghiệm 302 câu – Câu 166", "ch": 5, "q": "Trong nhà nước của dân, nhân dân thực thi quyền lực qua hình thức nào?", "o": ["Dân chủ trực tiếp và dân chủ gián tiếp.", "Hình thức phổ thông đầu p nghiệm 302 câu – Câu 242", "ch": 5, "q": "Để thực thi được pháp luật trong cuộc sống theo Hồ Chí Minh cần làm gì", "o": ["Cán bộ các cấp các ngành phải gương mẫu trong việc thực thi pháp luật, trước hết là các cán bộ thuộc ngành hành pháp và tư pháp", "Nâng cao dân trí, phát huy tính tích cực chính trị của nhân dân", "Tính nghiêm minh của pháp luật", "Tất cả các đáp án đều đúng"], "a": 3, "note": [], "n": 52}, {"src": "Trắc nghiệm 302 câu – Câu 249", "ch": 5, "q": "Theo Chủ tịch Hồ Chí Minh giải pháp căn bản và có ý nghĩa lâu dài đề phòng, chống tiêu cực trong Nhà nước là", "o": ["Nâng cao trình độ dân chủ trong xã hội, thực hành dân chủ rộng rãi, phát huy quyền làm chủ của nhân dân", "Cán bộ phải đi trước làm gương, cán bộ giữ chức vụ càng cao, trách nhiệm nêu gương càng lớn", "Tất cả các phương án", "Pháp luật của Nhà nước, kỷ luật của Đảng phải nghiêm minh"], "a": 0, "note": [], "n": 53}, {"src": "Trắc nghiệm 302 câu – Câu 252", "ch": 5, "q": "Theo tư tưởng Hồ Chí Minh, người thực thi pháp luật đúng là phải", "o": ["Bảo vệ được lợi ích của Đảng cầm quyền", "Thực sự nghiêm minh và tự giác", "Công tâm và duy trì sự cầm quyền của Đảng", "Thực sự công tâm và nghiêm minh"], "a": 3, "note": [], "n": 54}, {"src": "Trắc nghiệm 302 câu – Câu 261", "ch": 5, "q": "Chủ tịch Hồ Chí Minh đã trực tiếp chỉ đạo biên soạn những Hiến pháp nào của nước ta", "o": ["Hiến pháp năm 1959", "Hiến pháp năm 1946", "Hiến pháp năm 1959 và 1982", "Hiến pháp năm 1946 và 1959"], "a": 3, "note": [], "n": 55}, {"src": "Trắc nghiệm 302 câu – Câu 263", "ch": 5, "q": "Ngày 26/1/1946, Chủ tịch Hồ Chí Minh ký lệnh nói rõ tội tham ô, trộm cắp là tội gì", "o": ["Tử hình", "Phạt tù trên 20 năm", "Chung thân", "Phạt tù từ 5 năm đến 20 năm"], "a": 0, "note": [], "n": 56}, {"src": "Trắc nghiệm 302 câu – Câu 291", "ch": 5, "q": "Tìm đáp án sai, Nhà nước vì dân là nhà nước:", "o": ["Phục vụ nhân dân, đem lại lợi ích cho dân", "Chăm lo mọi mặt đời sống nhân dân", "Trong sạch, không được phép đặc quyền, đặc lợi", "Do dân làm chủ do dân tổ chức nên"], "a": 3, "note": [], "n": 57}, {"src": "Trắc nghiệm 302 câu – Câu 12", "ch": 6, "q": "Theo Hồ Chí Minh, các lực lượng của đoàn kết quốc tế là:", "o": ["Phong trào cộng sản và công nhân thế giới", "Phong trào đấu tranh giải phóng dân tộc", "Tất cả phương án", "Các lực lượng tiến bộ, những người yêu chuộng hòa bình, dân chủ, tự do, công lý"], "a": 2, "note": [], "n": 58}, {"src": "Trắc nghiệm 302 câu – Câu 21", "ch": 6, "q": "Điền từ hoặc cụm từ đúng vào dấu […]: “Đoàn kết là sức mạnh của chúng ta, đoàn kết là […] của chúng ta”", "o": ["Cái gốc", "Thành công", "Vẻ vang", "Thắng lợi"], "a": 3, "note": [], "n": 59}, {"src": "Trắc nghiệm 302 câu – Câu 22", "ch": 6, "q": "Điền từ hoặc cụm từ đúng vào dấu […]: “[…] có vững thì cây mới bền. Xây lầu thắng lợi trên nền […]”", "o": ["Gốc; nông dân", "Gốc; nhân dân", "Gốc; công nhân", "Rễ; công nông"], "a": 1, "note": [], "n": 60}, {"src": "Trắc nghiệm 302 câu – Câu 73", "ch": 6, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: Khẳng định sự cần thiết của việc xây dựng khối liên minh chiến đấu giữa các dân tộc thuộc địa để chống kẻ thù chung. Hồ Chí Minh nhấn mạnh phải “làm cho các dân tộc thuộc địa từ trước tới nay vẫn cách biệt nhau, hiểu biết nhau hơn và đoàn kết lại đặt cơ sở cho một liên minh phương Đông trong tương lai. Khối liên minh này sẽ là một trong những [...]”.", "o": ["Cái cánh của máy bay", "Cái cánh của một con chim", "Cánh tay của một con người", "Cái cánh của cách mạng vô sản"], "a": 3, "note": [], "n": 61}, {"src": "Trắc nghiệm 302 câu – Câu 79", "ch": 6, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Làm cho các dân tộc thuộc địa, từ trước tới nay vẫn [...], hiểu biết nhau hơn và đoàn kết lại để đặt cơ sở cho một Liên minh phương Đông tương lai, khối [...] này sẽ là một trong những cái cánh của cách mạng vô sản”.", "o": ["Chưa hiểu nhau; liên minh", "Xa cách nhau; đoàn kết", "Cách biệt nhau; liên minh", "Hiểu lầm nhau; đoàn kết"], "a": 2, "note": [], "n": 62}, {"src": "Trắc nghiệm 302 câu – Câu 94", "ch": 6, "q": "Điền từ hoặc cụm từ đúng vào dấu […]: trong đoàn kết với các dân tộc, Hồ Chí Minh nhấn mạnh: “Đồng bào tất cả các dân tộc, không phân biệt… thương yêu giúp đỡ lẫn nhau phải […] như anh em một nhà, để cùng nhau xây dựng tổ quốc chung”.", "o": ["Đoàn kết chặt chẽ.", "Đoàn kết lâu dài.", "Đoàn kết chân thành.", "Đoàn kết hợp tác."], "a": 0, "note": [], "n": 63}, {"src": "Trắc nghiệm 302 câu – Câu 119", "ch": 6, "q": "Lòng khoan dung độ lượng ở Hồ Chí Minh không phải là một sách lược nhất thời, một thủ đoạn chính trị mà là sự tiếp nối và phát triển của:", "o": ["Mục tiêu cách mạng.", "Truyền thống nhân ái, bao dung của dân tộc, từ chính mục tiêu của cuộc cách mạng.", "Truyền thống yêu nước của dân tộc, từ chính mục tiêu của cuộc cách mạng.", "Chủ nghĩa yêu nước, từ chính mục tiêu của cuộc cách mạng."], "a": 1, "note": [], "n": 64}, {"src": "Trắc nghiệm 302 câu – Câu 123", "ch": 6, "q": "“Có sức mạnh cả nước một lòng, lại có sự ủng hộ của nhân dân thế giới, chúng ta sẽ có một […] tổng hợp cộng với phương pháp cách mạng thích hợp, […] cách mạng nước ta sẽ đi đến đích cuối cùng”.", "o": ["Nền tảng, nhất định.", "Sức mạnh, nhất định.", "Nền tảng, chắc chắn.", "Sức mạnh, chắc chắn."], "a": 1, "note": [], "n": 65}, {"src": "Trắc nghiệm 302 câu – Câu 124", "ch": 6, "q": "Trong Bài nói tại buổi khai mạc Đại hội thống nhất Việt Minh – Liên Việt, Hồ Chí Minh khẳng định, khối đại đoàn kết của toàn dân sẽ phát triển thành đại đoàn kết giữa dân ta với những lực lượng nào trên thế giới? (Tác phẩm: Bài nói tại buổi khai mạc Đại hội thống nhất Việt Minh – Liên Việt).", "o": ["Nhân dân các nước bạn, nhân dân các nước Pháp, nhân dân yêu chuộng hòa bình.", "Nhân dân ba nước Đông Dương.", "Nhân dân Á – Phi – Mỹ Latinh.", "Phong trào cộng sản và công nhân quốc tế, phong trào giải phóng dân tộc và các lực lượng yêu chuộng hòa bình, công lý trên thế giới."], "a": 1, "note": [], "n": 66}, {"src": "Trắc nghiệm 302 câu – Câu 136", "ch": 6, "q": "Trong tư tưởng đoàn kết quốc tế, Hồ Chí Minh đã định hướng hình thành những tầng mặt trận nào?", "o": ["Mặt trận đại đoàn kết dân tộc, Mặt trận đoàn kết Việt – Miên – Lào.", "Tất cả phương án.", "Mặt trận đại đoàn kết dân tộc, Mặt trận nhân dân tiến bộ thế giới đoàn kết với Việt Nam.", "Mặt trận đại đoàn kết dân tộc, Mặt trận đoàn kết Việt – Miên – Lào, Mặt trận nhân dân Á – Phi đoàn kết với Việt Nam, Mặt trận nhân dân tiến bộ thế giới đoàn kết với Việt Nam chống đế quốc xâm lược."], "a": 3, "note": [], "n": 67}, {"src": "Trắc nghiệm 302 câu – Câu 148", "ch": 6, "q": "Để đoàn kết với phong trào cộng sản và công nhân quốc tế, Hồ Chí Minh chủ trương:", "o": ["Giương cao ngọn cờ hòa bình và công lý.", "Giương cao ngọn cờ độc lập, tự do, trên nền tảng của chủ nghĩa Mác – Lênin.", "Giương cao ngọn cờ độc lập dân tộc gắn liền với chủ nghĩa xã hội, thức hiện đoàn kết thống nhất trên nền tảng của chủ nghĩa Mác – Lênin và chủ nghĩa quốc tế vô sản, có lý, có tình, giương cao ngọn cờ độc lập, tự do.", "Thực hiện đoàn kết thống nhất trên nền tảng của chủ nghĩa Mác – Lênin và chủ nghĩa quốc tế vô sản."], "a": 2, "note": [], "n": 68}, {"src": "Trắc nghiệm 302 câu – Câu 152", "ch": 6, "q": "Theo Hồ Chí Minh, điều kiện để thực hiện đại đoàn kết dân tộc đó là:", "o": ["Kế thừa truyền thống yêu nước, nhân nghĩa, đoàn kết của dân tộc có lòng khoan dung, độ lượng với con người, có niềm tin vào nhân dân.", "Tất cả phương án.", "Có tinh thần nhiệt thành, cởi mở, độ lượng với con người.", "Có tấm lòng vị tha, độ lượng với con người."], "a": 0, "note": [], "n": 69}, {"src": "Trắc nghiệm 302 câu – Câu 155", "ch": 6, "q": "“Đồng bào tất cả các dân tộc, không phân biệt lớn nhỏ phải, thương yêu giúp đỡ lẫn nhau, phải […] như anh em một nhà, để cùng nhau xây dựng Tổ quốc chung”.", "o": ["Đoàn kết chặt chẽ.", "Đoàn kết lâu dài.", "Đoàn kết chân thành.", "Đoàn kết hợp tác."], "a": 0, "note": [], "n": 70}, {"src": "Trắc nghiệm 302 câu – Câu 156", "ch": 6, "q": "Trong mặt trận dân tộc thống nhất, Đảng cộng sản Việt Nam:", "o": ["Thành viên cốt cán của mặt trận dân tộc thống nhất.", "Đại biểu của giai cấp công nhân trong Mặt trận dân tộc thống nhất.", "Vừa là thành viên, vừa là lực lượng lãnh đạo Mặt trận dân tộc thống nhất.", "Là đại biểu của Mặt trận dân tộc thống nhất."], "a": 2, "note": [], "n": 71}, {"src": "Trắc nghiệm 302 câu – Câu 181", "ch": 6, "q": "Khi nói về đoàn kết trong tôn giáo Hồ Chí Minh nhấn mạnh cần", "o": ["Phải đoàn kết chặt chẽ giữa đồng bào lương và đồng bào các tôn giáo, cùng nhau xây dựng đời sống hòa thuận ấm lo, xây dựng Tổ quốc", "Tất cả phương án", "Phải đoàn kết toàn dân, phụng sự tổ quốc", "Đoàn kết đồng bào các tôn giáo cùng xây dựng cuộc sống ấm lo, hạnh phúc"], "a": 0, "note": [], "n": 72}, {"src": "Trắc nghiệm 302 câu – Câu 183", "ch": 6, "q": "Trong cuộc kháng chiến chống thực dân pháp, Hồ Chí Minh chủ trương xây dựng ở Đông Dương một mặt trận đoàn kết. Mặt trận đó tên gọi là gì?", "o": ["Mặt trận thống nhất của ba nước Đông Dương", "Mặt trận dân tộc Việt Nam đoàn kết với Campuchia, Lào", "Mặt trận đoàn kết ba nước Việt-Miên-Lào", "Mặt trận đoàn kết Việt-Miên-Lào"], "a": 3, "note": [], "n": 73}, {"src": "Trắc nghiệm 302 câu – Câu 187", "ch": 6, "q": "Khi nói về cơ sở xây dựng và hoạt động của Mặt trận dân tộc thống nhất Hồ Chí Minh nhận định", "o": ["Mặt trận là khối đoàn kết lâu dài, chặt chẽ, đoàn kết thực sự, chân thành, thân ái giúp đỡ nhau cùng tiến bộ", "Mặt trận là khối đoàn kết thật thà hợp tác và giúp đỡ lẫn nhau cùng tiến bộ, phát triển", "Mặt trận là khối đoàn kết lâu dài cần xóa bỏ hết mọi thành kiến, cần phải thật thà hợp tác và giúp đỡ lẫn nhau cùng tiến bộ", "Tất cả phương án"], "a": 0, "note": [], "n": 74}, {"src": "Trắc nghiệm 302 câu – Câu 190", "ch": 6, "q": "Theo Hồ Chí Minh, để thực hiện đại đoàn kết dân tộc có nhiều phương pháp, trong đó cần lưu ý các phương pháp sau:", "o": ["Tuyên truyền, giáo dục, tổ chức, xử lý đồng bộ các mối quan hệ nhằm thực hiện thêm bạn bớt thù", "Tuyên truyền, giáo dục, vận động quần chúng, tổ chức, xử lý đồng bộ các mối quan hệ nhằm thực hiện thêm bạn bớt thù", "Tất cả các đáp án", "Tuyên truyền, giáo dục, vận động quần chúng, giác ngộ xử lý đồng bộ các mối quan hệ nhằm thực hiện thêm bạn bớt thù"], "a": 1, "note": [], "n": 75}, {"src": "Trắc nghiệm 302 câu – Câu 195", "ch": 6, "q": "Theo Hồ Chí Minh mặt trận dân tộc thống nhất được xây dựng trên nền tảng liên minh công nhân – nông dân – trí thức đặt dưới sự lãnh đạo của", "o": ["Đảng Cộng sản", "Nhà nước và Đảng Cộng sản và các tổ chức chính trị - xã hội", "Đảng Cộng sản và nhà nước", "Nhà nước"], "a": 0, "note": [], "n": 76}, {"src": "Trắc nghiệm 302 câu – Câu 196", "ch": 6, "q": "Theo Hồ Chí Minh, mọi phương pháp tiếp cận và vận động quần chúng phải như thế nào", "o": ["Phải thuyết phục, tổ chức quần chúng", "Phù hợp với tâm tư, nguyện vọng của quần chúng", "Phải tôn trọng, lắng nghe quần chúng", "Phải lắng nghe tình cảm của quần chúng"], "a": 0, "note": [], "n": 77}, {"src": "Trắc nghiệm 302 câu – Câu 198", "ch": 6, "q": "Đối với phong trào cộng sản và công nhân quốc tế Hồ Chí Minh giương cao ngọn cờ", "o": ["Độc lập dân tộc gắn liền với chủ nghĩa xã hội", "Độc lập, tự do và quyền bình đẳng giữa các dân tộc", "Hòa bình trong công lý", "Độc lập dân tộc gắn liền với chủ nghĩa tư bản"], "a": 0, "note": ["Giải thích trong đề: “Giương cao ngọn cờ độc lập dân tộc gắn liền với chủ nghĩa xã hội, thức hiện đoàn kết thống nhất trên nền tảng của chủ nghĩa Mác – Lênin và chủ nghĩa quốc tế vô sản, có lý, có tình, giương cao ngọn cờ độc lập, tự do.”"], "n": 78}, {"src": "Trắc nghiệm 302 câu – Câu 201", "ch": 6, "q": "Đâu không phải là điều kiện để xây dựng khối đại đoàn kết toàn dân tộc theo tư tưởng Hồ Chí Minh", "o": ["Phải kế thừa truyền thống yêu nước, nhân nghĩa, đoàn kết của dân tộc", "Phải đứng trên lập trường của giai cấp công nhân", "Phải có lòng khoan dung, độ lượng với con người", "Phải có niềm tin vào nhân dân"], "a": 1, "note": [], "n": 79}, {"src": "Trắc nghiệm 302 câu – Câu 217", "ch": 6, "q": "Theo Hồ Chí Minh, Mặt trận dân tộc thống nhất và vấn đề liên minh công - nông luôn được Người xem xét trong mối quan hệ", "o": ["Tất cả phương án", "Biện chứng giữa dân tộc và giai cấp", "Biện chứng giữa giai cấp với mặt trận", "Biện chứng giữa toàn dân với Đảng"], "a": 1, "note": [], "n": 80}, {"src": "Trắc nghiệm 302 câu – Câu 220", "ch": 6, "q": "Theo Hồ Chí Minh, chính sách ngoại giao của nước Việt Nam sau khi giành được độc lập năm 1945 là", "o": ["Mềm dẻo về sách lược để làm bạn với tất cả mọi nước dân chủ và không gây thù oán với một ai", "Thân thiện với tất cả các nước dân chủ trên thế giới dễ giữ gìn hòa bình", "Độc lập, tự chủ và mềm dẻo về sách lược với tất cả các nước", "Độc lập, làm bạn với tất cả mọi nước dân chủ và không gây thù oán với một ai"], "a": 1, "note": ["Giải thích trong đề: “Chính sách ngoại giao của Chính phủ thì chỉ có một điều tức là thân thiện với tất cả các nước dân chủ trên thế giới để giữ gìn hòa bình”"], "n": 81}, {"src": "Trắc nghiệm 302 câu – Câu 241", "ch": 6, "q": "Theo Hồ Chí Minh, cả dân tộc hay toàn dân chỉ trở thành lực lượng cách mạng to lớn, trở thành sức mạnh vô địch khi được", "o": ["Giác ngộ về mục tiêu chiến đấu chung, được tổ chức thành một khối vững chắc và hoạt động theo một đường lối chính trị đúng đắn", "Giác ngộ về mục tiêu chiến đấu chung, được tổ chức thành tập thể vững chắc và hoạt động theo nguyên tắc hiệp thương dân chủ", "Giác ngộ về mục tiêu cách mạng, được tổ chức lại thành một mặt trận vững chắc và hoạt động theo một đường lối chính trị đúng đắn", "Giác ngộ về mục tiêu chiến đấu chung, được tổ chức thành một khối vững chắc và hoạt động theo nguyên tắc hiệp thương dân chủ"], "a": 0, "note": [], "n": 82}, {"src": "Trắc nghiệm 302 câu – Câu 250", "ch": 6, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Đoàn kết trong Mặt trận Việt Minh, nhân dân ta đã làm cách mạng Tháng Tám thành công, lập nên nước [...]”", "o": ["Cộng hòa xã hội chủ nghĩa Việt Nam", "Việt Nam Dân chủ Cộng hòa", "Việt Nam Cộng hòa", "Cộng hòa Dân chủ Việt Nam"], "a": 1, "note": [], "n": 83}, {"src": "Trắc nghiệm 302 câu – Câu 262", "ch": 6, "q": "Luận điểm sau của Hồ Chí Minh nhằm nói về “Đoàn kết, đoàn kết, đại đoàn kết Thành công, thành công, đại thành công”", "o": ["Vai trò của đại đoàn kết", "Hình thức đại đoàn kết", "Nguyên tắc đại đoàn kết", "Tính chất đại đoàn kết"], "a": 0, "note": [], "n": 84}, {"src": "Trắc nghiệm 302 câu – Câu 277", "ch": 6, "q": "Đoàn kết thống nhất trong phong trào cộng sản và công nhân quốc tế thì đoàn kết [...] là điều kiện quan trọng nhất để bảo đảm cho phong trào cộng sản và công nhân toàn thắng trong cuộc đấu tranh vĩ đại cho tương lai tươi sáng của toàn thể loài người.", "o": ["Quốc tế", "Cộng sản", "Giữa các Đảng", "Giữa các Đảng Cộng sản"], "a": 2, "note": [], "n": 85}, {"src": "Trắc nghiệm 302 câu – Câu 279", "ch": 6, "q": "Bộ phận nào không thuộc khối đại đoàn kết dân tộc:", "o": ["Đoàn kết các giai cấp, tầng lớp và những người Việt Nam định cư ở nước ngoài", "Đoàn kết tôn giáo", "Đoàn kết khối vô sản", "Đoàn kết trong Đảng"], "a": 2, "note": ["Giải thích trong đề: Lực lượng đại đoàn kết dân tộc - Đoàn kết trong Đảng - Đoàn kết giai cấp - Đoàn kết tôn giáo - Đoàn kết các dân tộc - Đoàn kết các giai cấp, tầng lớp và những người Việt Nam định cư ở nước ngoài"], "n": 86}, {"src": "Trắc nghiệm 302 câu – Câu 280", "ch": 6, "q": "Đâu không phải là điều kiện để thực hiện đại đoàn kết dân tộc?", "o": ["Phải có niềm tin vào nhân dân", "Phải biết yêu thương lẫn nhau", "Phải kế thừa truyền thống yêu nước - nhân nghĩa - đoàn kết của dân tộc", "Phải có lòng khoan dung, độ lượng với con người"], "a": 1, "note": ["Giải thích trong đề: Điều kiện để thực hiện đại đoàn kết dân tộc - Phải kế thừa truyền thống yêu nước - nhân nghĩa - đoàn kết của dân tộc - Phải có lòng khoan dung, độ lượng với con người - Phải có niềm tin vào nhân dân"], "n": 87}, {"src": "Trắc nghiệm 302 câu – Câu 282", "ch": 6, "q": "Theo quan điểm của Hồ Chí Minh, nền tảng của khối đại đoàn kết dân tộc là?", "o": ["Liên minh công nông và lao động trí óc", "Liên minh công nông", "Liên minh công nông và các tầng lớp lao động khác", "Liên minh công nông và các lực lượng yêu nước khác"], "a": 2, "note": ["File “Đề cương TLU” chấm “Liên minh công nông và lao động trí óc”; giáo trình (6.1.2.3) ghi cả hai ý: ban đầu “liên minh công nông là nền tảng”, về sau “lấy liên minh công – nông – lao động trí óc làm nền tảng”."], "n": 88}, {"src": "Trắc nghiệm 302 câu – Câu 19", "ch": 7, "q": "Câu nói sau được trích trong tác phẩm nào của Hồ Chí Minh? “Bồi dưỡng thế hệ cách mạng cho đời sau là việc làm rất quan trọng và cần thiết”", "o": ["Đạo đức cách mạng", "Đường cách mệnh", "Sửa đổi lối làm việc", "Di chúc"], "a": 3, "note": [], "n": 89}, {"src": "Trắc nghiệm 302 câu – Câu 23", "ch": 7, "q": "Theo Hồ Chí Minh, đối với một quốc gia, cần, kiệm, liêm, chính là thước đo:", "o": ["Bề dày của truyền thống đạo đức của dân tộc", "Sự giàu có của dân tộc Việt Nam", "Sự giàu có về vật chất, vững mạnh về tinh thần, thể hiện sự văn minh tiến bộ của dân tộc", "Sự phong phú của truyền thống văn hóa lâu đời của dân tộc"], "a": 2, "note": [], "n": 90}, {"src": "Trắc nghiệm 302 câu – Câu 26", "ch": 7, "q": "Trong tác phẩm Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân, theo quan điểm của Hồ Chí Minh một trong những yêu cầu mà mỗi cán bộ đảng viên cần phải làm để nâng cao đạo đức cách mạng là:", "o": ["Phải đặt lợi ích của cách mạng, của giai cấp nông dân lên trên hết", "Phải đặt lợi ích của cách mạng, của các giai cắp lên trên hết, trước hết", "Phải đặt lợi ích của cách mạng, của giai cắp công nhân lên trên hết", "Phải đặt lợi ích của cách mạng, của Đảng, của nhân dân lên trên hết, trước hết"], "a": 3, "note": [], "n": 91}, {"src": "Trắc nghiệm 302 câu – Câu 29", "ch": 7, "q": "Nguyên tắc quan trọng bậc nhất trong xây dựng một nền đạo đức mới theo tư tưởng Hồ Chí Minh là:", "o": ["Nói đi đôi với làm, phải nêu gương về đạo đức", "Xây đi đôi với chống", "Tu dưỡng đạo đức suốt đời", "Phải tạo thành phong trào quần chúng rộng rãi"], "a": 0, "note": [], "n": 92}, {"src": "Trắc nghiệm 302 câu – Câu 78", "ch": 7, "q": "Trước cách mạng Tháng Tám, Hồ Chí Minh định hướng xây dựng nền văn hóa trên những lĩnh vực nào?", "o": ["Kinh tế, chính trị, văn hóa, xã hội và luân lý", "Kinh tế, chính trị, văn hóa, xã hội và tâm lý", "Tâm lý, luân lý, xã hội, chính trị và kinh tế", "Tâm lý, văn hóa, xã hội, luân lý và kinh tế"], "a": 2, "note": [], "n": 93}, {"src": "Trắc nghiệm 302 câu – Câu 93", "ch": 7, "q": "Tìm câu chưa chính xác khi nói về tính khoa học của nền văn hóa mới theo tư tưởng Hồ Chí Minh:", "o": ["Tính khoa học biểu hiện kế thừa truyền thống tốt đẹp của dân tộc và tiếp thu tinh hoa văn hóa nhân loại.", "Tính khoa học là phải truyền bá tư tưởng triết học mácxit, đấu tranh chống lại chủ nghĩa duy tâm, thần bí, mê tín dị đoan, phải biết gạn đục, khơi trong", "Tính khoa học là tính tiên tiến nhưng chưa cần thuận với trào lưu tiến hóa của thời đại.", "Tính khoa học là phải đấu tranh chống lại những gì trái với khoa học, phản tiến bộ."], "a": 2, "note": ["Giải thích trong đề: Tính khoa học của nền văn hóa mới thể hiện ở tính hiện đại, tiên tiến, thuận với trào lưu tiến hóa của thời đại. Tính khoa học của văn hóa đòi hỏi phải đấu tranh chống lại những gì trái với khoa học, phản tiến bộ, phải truyền bá tư tưởng triết học mácxit, đấu tranh chống lại chủ nghĩa duy tâm, thần bí, mê tín dị đoan, phải biết gạn đục, khơi trong, kế thừa truyền thống tốt đẹp của dân tộc và tiếp thu tinh hoa văn hóa nhân loại."], "n": 94}, {"src": "Trắc nghiệm 302 câu – Câu 96", "ch": 7, "q": "Điền từ hoặc cụm từ đúng vào dấu […]: Phải chú trọng “đạo làm gương”, bởi vì theo Hồ Chí Minh, “Đối với các dân tộc phương Đông đều giàu tình cảm, và đối với họ một tấm gương sống còn có giá trị hơn […]”.", "o": ["Một trăm bài diễn văn tuyên truyền.", "Hàng trăm bài diễn văn tuyên truyền.", "Một trăm tủ sách.", "Hàng trăm hòm vàng."], "a": 0, "note": [], "n": 95}, {"src": "Trắc nghiệm 302 câu – Câu 109", "ch": 7, "q": "Điền từ hoặc cụm từ đúng vào dấu […]: “Đạo đức cách mạng không phải trên trời sa xuống. Nó do đấu tranh, rèn luyện bền bỉ hàng ngày mà phát triển củng cố. Cũng như […] càng mài càng sáng, […] càng luyện càng trong”.", "o": ["Đá – vàng.", "Vàng – đá.", "Vàng – ngọc.", "Ngọc – vàng."], "a": 3, "note": [], "n": 96}, {"src": "Trắc nghiệm 302 câu – Câu 114", "ch": 7, "q": "Theo Hồ Chí Minh, đấu tranh chống chủ nghĩa cá nhân không phải là:", "o": ["Giày xéo lên lợi ích cá nhân.", "Hy sinh lợi ích các nhân vì tập thể.", "Xóa bỏ lợi ích cá nhân.", "Lấy lợi ích cá nhân phục vụ lợi ích tập thể."], "a": 0, "note": [], "n": 97}, {"src": "Trắc nghiệm 302 câu – Câu 117", "ch": 7, "q": "Theo Hồ Chí Minh mục đích của tiếp thu tinh hoa văn hóa nhân loại là để:", "o": ["Làm cho văn hóa Việt Nam ngày càng phong phú.", "Làm giàu cho văn hóa Việt Nam, xây dựng văn hóa Việt Nam hợp với tinh thần dân chủ lao động.", "Làm cho văn hóa Việt Nam ngày càng hiện đại.", "Làm cho nền văn hóa Việt Nam mang tinh thần dân chủ."], "a": 1, "note": [], "n": 98}, {"src": "Trắc nghiệm 302 câu – Câu 118", "ch": 7, "q": "Theo Hồ Chí Minh phải nghiêm túc khắc phục các phản động lực trong con người và tổ chức. Đó là:", "o": ["Chủ nghĩa cá nhân.", "Tư tưởng tư sản.", "Phong cách tiểu tư sản.", "Chủ nghĩa vị kỷ."], "a": 0, "note": [], "n": 99}, {"src": "Trắc nghiệm 302 câu – Câu 121", "ch": 7, "q": "“[…] mới gánh được nặng và đi được xa. Người cách mạng phải có […] làm nền tảng mới hoàn thành được nhiệm vụ cách mạng vẻ vang”.", "o": ["Sức có mạnh - cần kiệm liêm chính.", "Sức có mạnh – đạo đức cách mạng", "Đạo đức cách mạng - cần kiệm liêm chính.", "Sức có mạnh - tinh thần cách mạng."], "a": 1, "note": [], "n": 100}, {"src": "Trắc nghiệm 302 câu – Câu 126", "ch": 7, "q": "“Giàu sang không […] nghèo khó không thế […] uy vũ không thể […]”.", "o": ["Khuất phục, quyến rũ, chuyển lay.", "Chuyển lay, khuất phục, quyến rũ.", "Quyến rũ, chuyển lay, khuất phục.", "Quyến rũ, chuyển lay, quật ngã."], "a": 2, "note": [], "n": 101}, {"src": "Trắc nghiệm 302 câu – Câu 130", "ch": 7, "q": "Theo tư tưởng Hồ Chí Minh trên mặt trận văn hóa […].", "o": ["Văn nghệ sĩ là chiến sĩ, tác phẩm văn nghệ là vũ khí sắc bén trong đấu tranh cách mạng, trong xây dựng xã hội mới, con người mới.", "Văn nghệ sĩ là những người đi đầu.", "Văn nghệ sĩ là những người hăng hái nhất.", "Văn nghệ sĩ là động lực của cuộc cách mạng."], "a": 0, "note": [], "n": 102}, {"src": "Trắc nghiệm 302 câu – Câu 132", "ch": 7, "q": "Hồ Chí Minh viết tác phẩm Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân, nhân kỷ niệm lần thứ bao nhiêu ngày thành lập Đảng?", "o": ["29 năm.", "39 năm.", "19 năm.", "49 năm."], "a": 1, "note": [], "n": 103}, {"src": "Trắc nghiệm 302 câu – Câu 137", "ch": 7, "q": "Tác phẩm Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân, của Hồ Chí Minh có bút danh gì?", "o": ["T.L.", "XYZ.", "Trần Lực.", "Hồ Chí Minh."], "a": 0, "note": [], "n": 104}, {"src": "Trắc nghiệm 302 câu – Câu 143", "ch": 7, "q": "Hồ Chí Minh cho rằng, nền giáo dục mới ở Việt Nam sẽ làm cho:", "o": ["Dân tộc chúng ta trở nên một dân tộc anh hùng.", "Dân tộc chúng ta trở nên một dân tộc hùng mạnh.", "Dân tộc chúng ta trở nên một dân tộc văn minh.", "Dân tộc chúng ta trở nên một dân tộc dũng cảm, yêu nước, yêu lao động, một dân tộc xứng đáng với nước Việt Nam độc lập."], "a": 3, "note": [], "n": 105}, {"src": "Trắc nghiệm 302 câu – Câu 158", "ch": 7, "q": "Theo Hồ Chí Minh, người chiến sĩ văn nghệ phải có những tác phẩm văn nghệ:", "o": ["Mới mẻ, sáng tạo.", "Xứng đáng với tầm vóc dân tộc.", "Phối hợp với xu thế phát triển của thời đại.", "Xứng đáng với thời đại mới của đất nước và dân tộc."], "a": 3, "note": [], "n": 106}, {"src": "Trắc nghiệm 302 câu – Câu 162", "ch": 7, "q": "Tìm phương án đúng nhất với tư tưởng Hồ Chí Minh trong các câu sau đây:", "o": ["Thanh niên là người kế thừa cách mạng cho thế hệ thanh niên già, đồng thời là người phụ trách, dìu dắt thế hệ thanh niên tương lai.", "Thanh niên là người tiếp nối cách mạng cho thế hệ thanh niên già, đồng thời là người phụ trách, dìu dắt thế hệ thanh niên tương lai.", "Thanh niên là người tiếp sức cách mạng cho thế hệ thanh niên già, đồng thời là người phụ trách, dìu dắt thế hệ thanh niên tương lai.", "Thanh niên là người tiếp bước cách mạng cho thế hệ thanh niên già, đồng thời là người phụ trách, dìu dắt thế hệ thanh niên tương lai."], "a": 2, "note": [], "n": 107}, {"src": "Trắc nghiệm 302 câu – Câu 167", "ch": 7, "q": "Trong bài “Xây dựng con người của chủ nghĩa xã hội”, Hồ Chí Minh nhấn mạnh: “Đợt chỉnh huấn lần này là một cuộc vận động lớn về tư tưởng trong Đảng và trong nhân dân lao động nhằm”:", "o": ["Xây dựng những con người của chủ nghĩa xã hội và có tác phong xã hội chủ nghĩa.", "Xây dựng những con người của chủ nghĩa xã hội.", "Xây dựng đất nước giàu mạnh, dân chủ, công bằng, văn minh.", "Xây dựng những con người có tác phong xã hội chủ nghĩa."], "a": 0, "note": [], "n": 108}, {"src": "Trắc nghiệm 302 câu – Câu 173", "ch": 7, "q": "Theo Hồ Chí Minh, muốn xây dựng chủ nghĩ xã hội trước hết cần có:", "o": ["Tài nguyên thiên nhiên của đất nước", "Kinh tế phát triển", "Con người xã hội chủ nghĩa", "Khoa học – kỹ thuật tiên tiến"], "a": 2, "note": [], "n": 109}, {"src": "Trắc nghiệm 302 câu – Câu 175", "ch": 7, "q": "Theo Hồ Chí Minh, yêu cầu đối với người chiến sĩ văn hóa là", "o": ["Lập trường, tư tưởng vững vàng, đặt lợi ích của Tổ quốc, của dân tộc và nhân dân lên trên hết", "Phải chiến đấu dũng cảm và vì nhân dân mà phục vụ", "Phải thường xuyên rèn luyện", "Phải chiến đấu dũng cảm và có lập trường, tư tưởng vững vàng"], "a": 0, "note": [], "n": 110}, {"src": "Trắc nghiệm 302 câu – Câu 178", "ch": 7, "q": "Điền từ hoặc cụm từ đúng vào dấu [..]: “Vì lẽ sinh tồn cũng như mục đích của cuộc sống, loài người mới sáng tạo và phát minh ra ngôn ngữ, chữ viết, đạo đức, pháp luật, khoa học, tôn giáo, văn học, nghệ thuật, những công cụ sinh hoạt hàng ngày, mặc, ăn, ở và [...]”", "o": ["Các hình thức biểu hiện", "Mọi hình thức thể hiện", "Các phương thức sử dụng", "Mọi phương tiện tồn tại"], "a": 2, "note": [], "n": 111}, {"src": "Trắc nghiệm 302 câu – Câu 180", "ch": 7, "q": "Theo Hồ Chí Minh, bản sắc dân tộc của nền văn hóa Việt Nam là gì", "o": ["Những giá trị văn hóa bên vững của cộng đồng các dân tộc Việt Nam, là thành quả của quá trình lao động, sản xuất, chiến đấu và giao lưu của con người Việt Nam", "Những thành quả mà dân tộc Việt Nam tạo ra trong quá trình sinh sống", "Những nhân tố tạo nên nét riêng của dân tộc Việt Nam", "Những phong tục tập quán của dân tộc Việt Nam"], "a": 0, "note": [], "n": 112}, {"src": "Trắc nghiệm 302 câu – Câu 200", "ch": 7, "q": "Theo quan điểm Hồ Chí Minh, mỗi đảng viên và cán bộ phải thật sự thấm nhuần điều gì?", "o": ["Con đường cách mạng", "Tư tưởng cách mạng", "Lý tưởng cách mạng", "Đạo đức cách mạng"], "a": 3, "note": ["Giải thích trong đề: “Mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng, thật sự cần, kiệm, liêm, chính, chí công vô tư. Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân”"], "n": 113}, {"src": "Trắc nghiệm 302 câu – Câu 206", "ch": 7, "q": "Theo Hồ Chí Minh tiêu chí tiếp thu tinh hoa văn hóa nhân loại là", "o": ["Cái gì hiện đại thì ta làm theo", "Có cái gì mới chúng ta phải làm theo", "Có cái gì khác biệt thì phải học", "Có cái gì hay, cái gì tốt là ta học lấy, phải lấy văn hóa dân tộc làm gốc"], "a": 3, "note": ["Giải thích trong đề: Tiêu chí tiếp thu là, có cái gì hay, cái gì tốt là ta học lấy, phải lấy văn hóa dân tộc làm gốc, đó là điều kiện, cơ sở để tiếp thu văn hóa nhân loại"], "n": 114}, {"src": "Trắc nghiệm 302 câu – Câu 207", "ch": 7, "q": "Chuẩn mực đạo đức cao đẹp nhất theo tư tưởng Hồ Chí Minh là", "o": ["Thương yêu con người, sống có nghĩa khí", "Thương yêu con người, sống có lí, có tình", "Quý trọng con người, sống có nghĩa, có tình", "Thương yêu con người, sống có tình nghĩa"], "a": 3, "note": ["Giải thích t
