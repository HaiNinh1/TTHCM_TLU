.stat{color:var(--mute);font-size:.9rem;margin-left:auto;font-variant-numeric:tabular-nums}

.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok b{color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.bad b{color:var(--bad)}
.msg{min-height:1.6em;margin:10px 0 4px;font-weight:600}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.note{color:var(--mute);font-size:.9rem;border-left:3px solid var(--line);padding-left:10px;margin:6px 0}
.nav{display:flex;gap:8px;margin-top:12px}
.nav .next{margin-left:auto;background:var(--acc);border-color:var(--acc);color:#fff}
.hint{color:var(--mute);font-size:.85rem;margin-top:14px}
.done h2{margin:0 0 8px}
.done li{margin-bottom:6px}

Con người xã hội chủ nghĩa", "Khoa học – kỹ thuật tiên tiến"], "a": 2, "note": ["💡 ⚠️ Không có nguyên văn trong bài giảng chương 1-3; đáp án theo PDF."]}, {"n": 46, "src": "PDF câu 118; trùng câu 145 · 3.2.1–3.2.2. Chủ nghĩa xã hội: quan niệm, đặc trưng, mục tiêu, động lực", "ch": 3, "q": "Theo Hồ Chí Minh phải nghiêm túc khắc phục các phản động lực trong con người và tổ chức. Đó là:", "o": ["Chủ nghĩa cá nhân", "Tư tưởng tư sản", "Phong cách tiểu tư sản", "Chủ nghĩa vị kỷ"], "a": 0, "note": []}, {"n": 47, "src": "PDF câu 212 · 3.2.1–3.2.2. Chủ nghĩa xã hội: quan niệm, đặc trưng, mục tiêu, động lực", "ch": 3, "q": "Theo Hồ Chí Minh, “kẻ địch nguy hiểm của chủ nghĩa xã hội” là", "o": ["Chủ nghĩa đế quốc", "Chủ nghĩa dân tộc hẹp hòi", "Chủ nghĩa cá nhân", "Chủ nghĩa tư bản"], "a": 2, "note": []}, {"n": 48, "src": "PDF câu 106; trùng câu 108 · 3.2.3. Thời kỳ quá độ lên chủ nghĩa xã hội", "ch": 3, "q": "Chọn đáp án đúng nhất theo Hồ Chí Minh: Đặc điểm to nhất của ta khi quá độ lên chủ nghĩa xã hội là:", "o": ["Từ một nước công nghiệp tiến thẳng lên chủ nghĩa xã hội không phải kinh qua giai đoạn phát triển tư bản chủ nghĩa", "Từ một nước nông nghiệp trung bình tiến thẳng lên chủ nghĩa xã hội không phải kinh qua giai đoạn phát triển tư bản chủ nghĩa", "Từ một nước nông nghiệp lạc hậu tiến thẳng lên chủ nghĩa xã hội không phải kinh qua giai đoạn phát triển tư bản chủ nghĩa", "Từ một nước nông nghiệp phát triển tiến thẳng lên chủ nghĩa xã hội không phải kinh qua giai đoạn phát triển tư bản chủ nghĩa"], "a": 2, "note": []}, {"n": 49, "src": "PDF câu 131 · 3.2.3. Thời kỳ quá độ lên chủ nghĩa xã hội", "ch": 3, "q": "Tìm một câu có nội dung không đúng trong các phương án sau : Hồ Chí Minh tính chất khó khăn phức tạp của thời kỳ quá độ lên chủ nghĩa xã hội nước ta:", "o": ["Luôn bị các thế lực phản động trong và ngoài nước tìm cách quấy phá", "Đây là cuộc cách mạng làm đảo lộn mọi mặt đời sống xã hội", "Trong sự nghiệp xây dựng chủ nghĩa xã hội, Đảng, nhà nước, nhân dân chưa có kinh nghiệm", "Đây là cuộc cách mạng chỉ làm thay đổi thói quen cũ trong mỗi con người"], "a": 3, "note": ["📝 Tính chất khó khăn, phức tạp của thời kỳ quá độ: -Đây là cuộc cách mạng làm đảo lộn mọi mặt đời sống xã hội cả lực lượng sản xuất, quan hệ sản xuất, kiến trúc thượng tầng -Đảng nhà nước và nhân dân ta chưa có nhiều kinh nghiệm, nhất là trên lĩnh vực kinh tế -Sự nghiệp của chúng ta bị các thế lực phản động trong và ngoài nước tìm cách chống phá"]}, {"n": 50, "src": "PDF câu 87 · 3.2.3. Thời kỳ quá độ lên chủ nghĩa xã hội", "ch": 3, "q": "Theo Hồ Chí Minh, nhiệm vụ quan trọng nhất của thời kỳ quá độ lên chủ nghĩa xã hội là:", "o": ["Cải tạo xã hội cũ, xây dựng xã hội mới", "Xây dựng tiền đề về kinh tế, chính trị, văn hóa, tư tưởng cho chủ nghĩa xã hội", "Xây dựng nền tảng vật chất và kỹ thuật của chủ nghĩa xã hội", "Tất cả phương án"], "a": 3, "note": ["📝 Nhiệm vụ quan trọng nhất của thời kỳ quá độ là phải xây dựng nền tảng vật chất và kỹ thuật của chủ nghĩa xã hội; xây dựng tiền đề về kinh tế, chính trị, văn hóa, tư tưởng cho chủ nghĩa xã hội; cải tạo xã hội cũ, xây dựng xã hội mới"]}, {"n": 51, "src": "PDF câu 238 · 3.2.3. Thời kỳ quá độ lên chủ nghĩa xã hội", "ch": 3, "q": "Tìm một câu có nội dung không đúng trong những phương án sau. Theo Hồ Chí Minh, nhiệm vụ lịch sử của thời kì quá độ ở Việt Nam là", "o": ["Xây dựng nền tảng vật chất và kĩ thuật của chủ nghĩa xã hội", "Xây dựng chủ nghĩa xã hội mang tính quốc tế", "Cải tạo xã hội cũ và xây dựng xã hội mới, trong đó lấy xây dựng làm trọng tâm, làm nội dung cốt yếu nhất, chủ chốt, lâu dài", "Xây dựng các tiền đề về kinh tế, chính trị, văn hóa, tư tưởng cho chủ nghĩa xã hội"], "a": 1, "note": []}, {"n": 52, "src": "PDF câu 56 · 3.2.3. Thời kỳ quá độ lên chủ nghĩa xã hội", "ch": 3, "q": "Theo Hồ Chí Minh, trong quá trình cách mạng xã hội chủ nghĩa, chúng ta phải cải tạo nền kinh tế cũ và xây dựng nền kinh tế mới mà:", "o": ["Cải tạo xã hội cũ và xây dựng xã hội mới đều là nhiệm vụ trọng tâm", "Cải tạo nền kinh tế cũ là nhiệm vụ trung tâm, chủ chốt", "Cải tạo nền kinh tế cũ", "Xây dựng là nhiệm vụ chủ chốt và lâu dài"], "a": 3, "note": ["🔗 Tự luận: Chương 3, câu 22."]}, {"n": 53, "src": "PDF câu 90 · 3.2.3. Thời kỳ quá độ lên chủ nghĩa xã hội", "ch": 3, "q": "Hoàn chỉnh câu sau: Muốn cải tạo xã hội chủ nghĩa thì phải cải tạo chính mình, nếu không có tư tưởng xã hội chủ nghĩa thì […]", "o": ["Không có nền kinh tế phát triển", "Tất cả phương án", "Không làm việc xã hội chủ nghĩa được", "Không có khoa học kỹ thuật tiên tiến"], "a": 2, "note": ["🔗 Tự luận: Chương 3, câu 26."]}, {"n": 54, "src": "PDF câu 54; trùng câu 24 · 3.2.3. Thời kỳ quá độ lên chủ nghĩa xã hội", "ch": 3, "q": "Trong nội dung xây dựng kinh tế thời kỳ quá độ lên chủ nghĩa xã hội, Hồ Chí Minh đã chủ trương xây dựng những cơ cấu nào?", "o": ["Cơ cấu kinh tế ngành, cơ cấu các thành phần kinh tế, cơ cấu vùng kinh tế", "Cơ cấu các thành phần kinh tế, cơ cấu vùng kinh tế và lãnh thổ", "Cơ cấu kinh tế ngành, cơ cấu các thành phần kinh tế, cơ cấu vùng kinh tế và lãnh thổ", "Cơ cấu vùng kinh tế và lãnh thổ, cơ cấu kinh tế ngành"], "a": 2, "note": ["💡 Bản trùng (câu 24) tách 3 cơ cấu thành 3 phương án → chọn “Tất cả phương án”."]}, {"n": 55, "src": "PDF câu 273 · 3.2.3. Thời kỳ quá độ lên chủ nghĩa xã hội", "ch": 3, "q": "Khi xác định vị trí và xu hướng vận động của từng thành phần kinh tế trong thời kỳ quá độ, Hồ Chí Minh ưu tiên phát triển thành phần kinh tế nào?", "o": ["Tư sản công thương", "Kinh tế hợp tác xã", "Kinh tế cá nhân", "Kinh tế quốc doanh"], "a": 3, "note": ["🔗 Tự luận: Chương 3, câu 29."]}, {"n": 56, "src": "PDF câu 43 · 3.2.3. Thời kỳ quá độ lên chủ nghĩa xã hội", "ch": 3, "q": "Quan điểm của Hồ Chí Minh đối với những nhà tư sản công thương trong phát triển kinh tế nhiều thành phần là:", "o": ["Không xóa bỏ quyền sở hữu về tư liệu sản xuất và của cải khác của họ; hướng dẫn họ hoạt động làm lợi cho quốc kế dân sinh, phù hợp với kinh tế nhà nước, khuyến khích và giúp đỡ họ cải tạo theo chủ nghĩa xã ệm đáp án là B. Chủ nghĩa Mác-Lênin và thực tiễn Việt Nam."]}, {"n": 64, "src": "PDF câu 115; trùng câu 159 · 3.2.3. Thời kỳ quá độ lên chủ nghĩa xã hội", "ch": 3, "q": "Theo Hồ Chí Minh trong các biện pháp xây dựng chủ nghĩa xã hội, biện pháp nào được xác định là cơ bản, quyết định, lâu dài?", "o": ["Phải huy động hết các nguồn lực vốn có trong dân để làm lợi cho dân", "Kết hợp xây dựng với bảo vệ tiến hành đồng thời hai nhiệm vụ chiến lược ở hai miền đất nước", "Huy động nguồn vốn đầu tư nước ngoài", "Thực hiện cải tạo xã hội cũ, xây dựng xã hội mới"], "a": 0, "note": ["🔗 Tự luận: Chương 3, câu 19."]}, {"n": 65, "src": "PDF câu 174 · 3.3. Mối quan hệ giữa độc lập dân tộc và chủ nghĩa xã hội", "ch": 3, "q": "Tìm câu có nội dung không đúng trong các phương án dưới đây. Theo Hồ Chí Minh, mối quan hệ giữa độc lập dân tộc và chủ nghĩa xã hội là", "o": ["Chủ nghĩa xã hội là tiền đề thực hiện độc lập dân tộc", "Chủ nghĩa xã hội là điều kiện vững chắc để đảm bảo nền độc lập dân tộc", "Độc lập dân tộc là cơ sở, tiền đề để tiến lên chủ nghĩa xã hội", "Độc lập dân tộc và chủ nghĩa xã hội luôn gắn liền với nhau làm điều kiện, tiền đề đảm bảo cho nhau phát triển"], "a": 0, "note": []}, {"n": 66, "src": "PDF câu 285 · 3.3. Mối quan hệ giữa độc lập dân tộc và chủ nghĩa xã hội", "ch": 3, "q": "Điều kiện nào sau đây không phải là điều kiện đảm bảo cho độc lập dân tộc gắn liền với chủ nghĩa xã hội là?", "o": ["Phải bảo đảm vai trò lãnh đạo tuyệt đối của Đảng Cộng sản trong suốt tiến trình cách mạng", "Phải củng cố và tăng cường khối đại đoàn kết dân tộc mà nền tảng là khối liên minh công - nông - trí", "Phải đoàn kết, gắn bó chặt chẽ với cách mạng thế giới", "Phải giữ vững niềm tin vào chủ nghĩa Mác - Lênin"], "a": 3, "note": ["📝 Điều kiện đảm bảo cho độc lập dan tộc gắn liền với chủ nghĩa xã hội -Phải bảo đảm vai trò lãnh đạo tuyệt đối của Đảng Cộng sản trong suốt tiến trình cách mạng -Phải củng cố và tăng cường khối đại đoàn kết dân tộc mà nền tảng là khối liên minh công - nông - trí -Phải đoàn kết, gắn bó chặt chẽ với cách mạng thế giới"]}, {"n": 67, "src": "PDF câu 92; trùng câu 186 · 3.3. Mối quan hệ giữa độc lập dân tộc và chủ nghĩa xã hội", "ch": 3, "q": "Hồ Chí Minh khẳng định như thế nào về con đường cách mạng Việt Nam?", "o": ["Hoàn thành cách mạng dân tộc, dân chủ nhân dân, tiến nhanh lên chủ nghĩa xã hội", "Tiến hành giải phóng dân tộc và đi lên chủ nghĩa tư bản", "Tiến hành giải phóng dân tộc, hoàn thành cách mạng dân tộc dân chủ nhân dân tiến nhanh lên chủ nghĩa tư bản", "Tiến hành giải phóng dân tộc, hoàn thành cách mạng dân tộc dân chủ nhân dân tiến dần lên chủ nghĩa xã hội"], "a": 3, "note": []}, {"n": 68, "src": "PDF câu 302; trùng câu 33 · 3.3. Mối quan hệ giữa độc lập dân tộc và chủ nghĩa xã hội", "ch": 3, "q": "Điều mong muốn cuối cùng của Hồ Chí Minh ghi trong di chúc là gì ?", "o": ["Xây dựng một nước Việt Nam Phồn Vinh và Cường Thịnh", "Xây dựng một nước Việt Nam hòa bình, thống nhất, dân chủ, độc lập, giàu mạnh", "Xây dựng một nước Việt Nam dân chủ, công bằng, văn minh", "Làm cho mọi người được hạnh phúc"], "a": 1, "note": ["🔗 Tự luận: Chương 3, câu 21. 💡 Bản trùng (câu 33) có đáp án “Tất cả phương án”: hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh, góp phần xứng đáng vào sự nghiệp cách mạng thế giới."]}, {"n": 69, "src": "PDF câu 50 · Tác phẩm: Chánh cương vắn tắt, Sách lược vắn tắt", "ch": 3, "q": "Trong Chính cương vắn tắt, Hồ Chí Minh xác định phương hướng chiến lược của cách mạng Việt Nam như thế nào?", "o": ["Làm tư sản dân quyền cách mạng để đi tới xã hội cộng sản", "Làm cách mạnh tư sản và thổ địa cách mạng để đi tới xây dựng chủ nghĩa tư bản", "Làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội tư bản", "Làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản"], "a": 3, "note": ["🔗 Tự luận: Chương 3, câu 36."]}, {"n": 70, "src": "PDF câu 105 · Tác phẩm: Chánh cương vắn tắt, Sách lược vắn tắt", "ch": 3, "q": "Câu “Chủ trương làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản” được trích từ văn kiện nào của Hồ Chí Minh?", "o": ["Chương trình tóm tắt", "Đường cách mệnh", "Chính cương vắn tắt", "Sách lược vắn tắt"], "a": 2, "note": []}, {"n": 71, "src": "PDF câu 129 · Tác phẩm: Chánh cương vắn tắt, Sách lược vắn tắt", "ch": 3, "q": "Trong cương lĩnh chính trị của Đảng, Hồ Chí Minh xác định mục tiêu chính trị của Đảng là gì?", "o": ["Dân chúng được tự do tổ chức, nam nữ được bình quyền phổ thông giáo dục theo hướng công nông hóa", "Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến, làm cho nước Nam được hoàn toàn độc lập, dựng ra Chính phủ công nông binh và tổ chức ra quân đội công nông", "Thủ tiêu hết quốc trái, thu hết sản nghiệp lớn của đế quốc Pháp tư bản giao cho chính phủ công nông", "Tư sản dân quyền cách mạng và thổ địa cách mạng dể đi tới xã hội cộng sản"], "a": 1, "note": ["🔗 Tự luận: Chương 3, câu 38. 💡 A = nhiệm vụ về xã hội, C = nhiệm vụ về kinh tế, D = phương hướng chiến lược."]}, {"n": 72, "src": "PDF câu 286 · Tác phẩm: Chánh cương vắn tắt, Sách lược vắn tắt", "ch": 3, "q": "Trong Sách lược vắn tắt, Hồ Chí Minh xác định: Đảng cần phải thu phục bộ phận nào?", "o": ["Đại bộ phận dân cày", "Trung nông", "Công nhân", "Nông dân"], "a": 0, "note": ["🔗 Tự luận: Chương 3, câu 39. 💡 Đầy đủ: thu phục đại bộ phận giai cấp mình (vô sản) và đại bộ phận dân cày."]}, {"n": 73, "src": "PDF câu 101 · Tác phẩm: Chánh cương vắn tắt, Sách lược vắn tắt", "ch": 3, "q": "Trong Sách lược vắn tắt, Hồ Chí Minh xác định: Đảng cần phải liên lạc với bộ phận giai cấp nào trong xã hội?", "o": ["Tiểu tư sản, trí thức, trung nông, Thanh niên, Tân Việt", "Phú nông, trung, tiểu địa chủ và tri thức An Nam", "Phú nông, tư bản An Nam", "Trung, tiểu địa chủ"], "a": 0, "note": ["🔗 Tự luận: Chương 3, câu 40."]}, {"n": 74, "src": "PDF câu 58 · Tác phẩm: Chánh cương vắn tắt, Sách lược vắn tắt", "ch": 3, "q": "Hoàn chỉnh câu sau: “Bộ phận nào mà ra mặt phản cách mạng […] thì phải đánh đổ”. (Trong tác phẩm “Sách lược vắn tắt của Đảng”).", "o": ["Đảng Việt Cách", "Đảng Lập hiến", "Việt Nam Quốc dân đảng", "Tân Việt Cách mạng đảng"], "a": 1, "note": []}, {"n": 75, "src": "PDF câu 290 · Tác phẩm: Thường thức chính trị", "ch": 3, "q": "Tác phẩm “Thưởng thức chính trị” bác viết dưới bút danh nào?", "o": ["T.L", "X.Y.Z", "Trần Lực", "Đ.X"], "a": 3, "note": ["💡 Bút danh: Đ.X – Thường thức chính trị; X.Y.Z – Sửa đổi lối làm việc; T.L – Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân."]}, {"n": 76, "src": "PDF câu 5 · Tác phẩm: Thường thức chính trị", "ch": 3, "q": "Hoàn chỉnh câu sau: “Cộng sản có 2 giai đoạn, giai đoạn thấp tức là [1], giai đoạn cao là [2]” (Trong tác phẩm: Thưởng thức chính trị-45. CNXH)", "o": ["Chủ nghĩa xã hội, Chủ nghĩa cộng sản", "Thời kỳ quá độ, Chủ nghĩa cộng sản", "Chủ nghĩa tư bản, Chủ nghĩa cộng sản", "Cách mạng giải phóng dân tộc, Chủ nghĩa xã hội"], "a": 0, "note": ["🔗 Tự luận: Chương 3, câu 41."]}, {"n": 77, "src": "PDF câu 64; trùng câu 81 · Tác phẩm: Thường thức chính trị", "ch": 3, "q": "Điểm giống và khác nhau giữa hai giai đoạn của “Cộng sản” (Trong tác phẩm Thưởng thức chính trị) là gì?", "o": ["Chủ nghĩa xã hội vẫn còn chút ít vết tích của xã hội cũ, xã hội cộng sản thì hoàn toàn không còn vết tích của xã hội cũ", "Chủ nghĩa xã hội là tư bản, địa chủ không còn nữa, xã hội cộng sản là khoa học ngày càng phát triển", "Chủ nghĩa xã hội là tư liệu sản xuất tập trung tỏng hợp tác xã, xã hội cộng sản thì tư liệu sản xuất là của chung", "Chủ nghĩa xã hội không còn vết tích của xã hội cũ, xã hội cộng sản là làm theo năng lực, hưởng theo nhu cầu"], "a": 0, "note": ["🔗 Tự luận: Chương 3, câu 42. 💡 Bản trùng (câu 81) hỏi ngược “luận điểm nào KHÔNG phải của Hồ Chí Minh” → chọn “Chủ nghĩa xã hội không còn vết tích của xã hội cũ…”."]}];
const L = 'ABCD', KEY = 'tthcm-145-v1';
let st = {ch: 0, mode: 'quiz', order: [], i: 0, ans: {}, optOrd: {}, flip: {}};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.order) st = s; } catch (e) {}
const $ = id => document.getElementById(id);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const byN = n => ALL.find(q => q.n === n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function start(list, mix) {
  st.order = mix ? shuffle(list.slice()) : list.slice();
  st.i = 0; st.ans = {}; st.flip = {}; st.optOrd = {};
  save(); render();
}
const pool = () => ALL.filter(q => !st.ch || q.ch === st.ch).map(q => q.n);
function optOrder(q) {
  // "Tất cả phương án" giữ nguyên vị trí gốc nên không trộn phương án; chỉ trộn thứ tự câu
  return [0, 1, 2, 3];
}
function esc(s) { return s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c])); }
function render() {
  document.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', +b.dataset.ch === st.ch));
  $('mode').textContent = 'Chế độ: ' + (st.mode === 'quiz' ? 'trắc nghiệm' : 'lật thẻ');
  const n = st.order.length, done = Object.keys(st.ans).length;
  const right = st.order.filter(k => st.ans[k] === byN(k).a).length;
  $('stat').textContent = st.mode === 'quiz' ? `Câu ${Math.min(st.i + 1, n)}/${n} · đúng ${right} · sai ${done - right}` : `Thẻ ${Math.min(st.i + 1, n)}/${n}`;
  $('prog').style.width = (n ? (st.mode === 'quiz' ? done : st.i + 1) / n * 100 : 0) + '%';
  $('wrong').disabled = !st.order.some(k => k in st.ans && st.ans[k] !== byN(k).a);
  const c = $('card');
  if (!n) { c.innerHTML = 'Không có câu nào.'; return; }
  if (st.i >= n) {
    const bad = st.order.filter(k => k in st.ans && st.ans[k] !== byN(k).a);
    c.innerHTML = `<div class="done"><h2>Xong lượt này: đúng ${right}/${n}</h2>` +
      (bad.length ? `<p>Các câu sai, kèm đáp án đúng:</p><ul>${bad.map(k => { const q = byN(k); return `<li>${esc(q.q)}<br><b>${L[q.a]}. ${esc(q.o[q.a])}</b></li>`; }).join('')}</ul>` : '<p>Không sai câu nào.</p>') +
      `<div class="nav"><button onclick="go(-1)">← Xem lại</button></div></div>`;
    return;
  }
  const q = byN(st.order[st.i]), picked = st.ans[q.n], shown = st.mode === 'quiz' ? picked !== undefined : !!st.flip[q.n];
  let h = `<div class="meta">Chương ${q.ch} · ${esc(q.src)}</div><div class="q">${esc(q.q)}</div>`;
  optOrder(q).forEach(k => {
    let cls = 'opt';
    if (shown && k === q.a) cls += ' ok';
    else if (shown && k === picked) cls += ' bad';
    h += `<button class="${cls}" ${st.mode === 'quiz' && !shown ? `onclick="pick(${k})"` : 'disabled'}><b>${L[k]}.</b><span>${esc(q.o[k])}</span></button>`;
  });
  if (st.mode === 'quiz') h += `<div class="msg ${shown ? (picked === q.a ? 'ok' : 'bad') : ''}">${shown ? (picked === q.a ? 'Đúng.' : `Sai. Đáp án: ${L[q.a]}. ${esc(q.o[q.a])}`) : ''}</div>`;
  else h += `<div class="msg ok">${shown ? `Đáp án: ${L[q.a]}. ${esc(q.o[q.a])}` : ''}</div>`;
  if (shown && q.note.length) h += `<div class="note">${q.note.map(esc).join('<br>')}</div>`;
  h += `<div class="nav"><button onclick="go(-1)" ${st.i ? '' : 'disabled'}>← Trước</button>` +
    (st.mode === 'flip' ? `<button onclick="flip()">${shown ? 'Ẩn đáp án' : 'Hiện đáp án'}</button>` : '') +
    `<button class="next" onclick="go(1)">Sau →</button></div>`;
  c.innerHTML = h;
}
function pick(k) { const q = byN(st.order[st.i]); if (st.mode !== 'quiz' || q.n in st.ans) return; st.ans[q.n] = k; save(); render(); }
function flip() { const n = st.order[st.i]; st.flip[n] = !st.flip[n]; save(); render(); }
function go(d) { st.i = Math.max(0, Math.min(st.order.length, st.i + d)); save(); render(); }
[[0, 'Tất cả'], [1, 'Chương 1'], [2, 'Chương 2'], [3, 'Chương 3']].forEach(([ch, t]) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.dataset.ch = ch;
  b.textContent = `${t} (${ALL.filter(q => !ch || q.ch === ch).length})`;
  b.onclick = () => { st.ch = ch; start(pool(), false); };
  $('chips').appendChild(b);
});
$('shuf').onclick = () => start(pool(), true);
$('reset').onclick = () => start(pool(), false);
$('mode').onclick = () => { st.mode = st.mode === 'quiz' ? 'flip' : 'quiz'; save(); render(); };
$('wrong').onclick = () => start(st.order.filter(k => k in st.ans && st.ans[k] !== byN(k).a), true);
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '4') pick(+k - 1);
  else if (k.length === 1 && 'abcd'.includes(k)) pick('abcd'.indexOf(k));
  else if (k === 'enter' || k === 'arrowright') go(1);
  else if (k === 'arrowleft') go(-1);
  else if (k === ' ' && st.mode === 'flip') { e.preventDefault(); flip(); }
});
if (!st.order.length) start(pool(), false); else render();
</script>
