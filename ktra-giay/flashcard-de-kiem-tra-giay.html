<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn đề kiểm tra giấy</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#23201b;--mute:#6f675b;--line:#ddd5c5;--acc:#9b2c2c;--ok:#1f7a4d;--okbg:#e2f3e8;--bad:#b3261e;--badbg:#fbe4e1}
@media (prefers-color-scheme:dark){:root{--bg:#191714;--card:#24211d;--ink:#ece6da;--mute:#a1988a;--line:#3b362f;--acc:#e08a7d;--ok:#6fd19c;--okbg:#1d3a2a;--bad:#ff8a80;--badbg:#45211e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.25rem;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stat{color:var(--mute);font-size:.9rem;margin-left:auto;font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.meta{color:var(--mute);font-size:.85rem;margin-bottom:8px}
.q{font-size:1.1rem;font-weight:600;margin-bottom:16px}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin-bottom:9px;padding:11px 14px}
.opt b{color:var(--acc);flex:none}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok b{color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.bad b{color:var(--bad)}
.msg{min-height:1.6em;margin:10px 0 4px;font-weight:600}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.note{color:var(--mute);font-size:.9rem;border-left:3px solid var(--line);padding-left:10px;margin:6px 0}
.nav{display:flex;gap:8px;margin-top:12px}
.nav .next{margin-left:auto;background:var(--acc);border-color:var(--acc);color:#fff}
.hint{color:var(--mute);font-size:.85rem;margin-top:14px}
.done h2{margin:0 0 8px}
.done li{margin-bottom:6px}
</style>
</head>
<body>
<main>
<h1>Ôn đề kiểm tra giấy TTHCM – 70 câu (đề 101/202)</h1>
<p class="hint" style="margin:0 0 12px">32 câu thuộc chương 1–3, 38 câu thuộc chương 4–7. Mặc định mở bộ <b>Chương 4–7</b>.</p>
<div class="bar" id="chips"></div>
<div class="bar">
  <button id="shuf">Trộn câu</button>
  <button id="mode">Chế độ: trắc nghiệm</button>
  <button id="wrong">Ôn câu sai</button>
  <button id="reset">Làm lại</button>
  <span class="stat" id="stat"></span>
</div>
<div class="prog"><i id="prog"></i></div>
<div class="card" id="card"></div>
<p class="hint">Phím tắt: 1–4 hoặc A–D để chọn, Enter / → sang câu sau, ← về câu trước, Space lật thẻ (chế độ lật thẻ).</p>
</main>
<script>
const ALL = [{"n": 1, "src": "Đề 101 câu 1 · 3.1.1. Quan điểm về độc lập dân tộc", "ch": 3, "q": "Tìm câu có nội dung KHÔNG ĐÚNG trong các phương án sau: Tư tưởng Hồ Chí Minh về độc lập dân tộc bao gồm các nội dung:", "o": ["Bạo lực cách mạng, giải phóng dân tộc", "Độc lập phải gắn liền với thống nhất, chủ quyền và toàn vẹn lãnh thổ", "Độc lập dân tộc gắn với tự do, cơm no, áo ấm, hạnh phúc cho nhân dân", "Độc lập, tự do là quyền thiêng liêng, bất khả xâm phạm của tất cả các dân tộc"], "a": 0, "note": ["4 nội dung về độc lập dân tộc (3.1.1): quyền thiêng liêng; gắn tự do, cơm no áo ấm, hạnh phúc; độc lập thật sự, hoàn toàn, triệt để; gắn thống nhất, toàn vẹn lãnh thổ."]}, {"n": 2, "src": "Đề 101 câu 2 · 6.1.1. Vai trò của đại đoàn kết dân tộc", "ch": 6, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: Theo quan điểm của Hồ Chí Minh, đại đoàn kết dân tộc là mục tiêu, nhiệm vụ hàng đầu của [...].", "o": ["Của cách mạng", "Đảng và dân tộc", "Của toàn thể nông dân", "Của liên minh công nông"], "a": 1, "note": []}, {"n": 3, "src": "Đề 101 câu 3 · 4.2.2. Nội dung xây dựng Đảng – công tác cán bộ", "ch": 4, "q": "Trong Mấy điểm lớn trong chính sách cán bộ (phần Vấn đề cán bộ, tác phẩm Sửa đổi lối làm việc), theo Hồ Chí Minh cần phải chú ý những việc nào?", "o": ["Thương yêu và phê bình cán bộ", "Khéo dùng cán bộ, cất nhắc cán bộ", "Hiểu biết cán bộ", "Hiểu biết cán bộ, khéo dùng cán bộ, cất nhắc cán bộ, thương yêu cán bộ, phê bình cán bộ"], "a": 3, "note": []}, {"n": 4, "src": "Đề 101 câu 4 · 2.2.3. Thời kỳ 1920–1930", "ch": 2, "q": "Những năm 1923–1924, tại Liên Xô, Nguyễn Ái Quốc tham dự các Đại hội quốc tế nào?", "o": ["Quốc tế Thanh niên", "Tất cả phương án", "Quốc tế Nông dân", "Quốc tế Cộng sản"], "a": 1, "note": []}, {"n": 5, "src": "Đề 101 câu 5 · 1.1.3. Vị trí của môn học", "ch": 1, "q": "Mối quan hệ giữa môn học Tư tưởng Hồ Chí Minh và các môn khoa học với tư cách là ba bộ phận cấu thành chủ nghĩa Mác – Lênin được xác định như thế nào?", "o": ["Là mối quan hệ tác động qua lại", "Là mối quan hệ giữa hệ thống quan điểm của Hồ Chí Minh với cơ sở của nó", "Là mối quan hệ biện chứng", "Có mối quan hệ thống nhất chặt chẽ với nhau"], "a": 1, "note": ["Trên đề có gạch bỏ C, chọn B – khớp giáo trình mục 1.1.3."]}, {"n": 6, "src": "Đề 101 câu 6 · 3.1.2.3. Lực lượng cách mạng (Sách lược vắn tắt)", "ch": 3, "q": "Trong Sách lược vắn tắt, Hồ Chí Minh xác định: Đảng cần phải liên lạc với bộ phận giai cấp nào trong xã hội?", "o": ["Trung, tiểu địa chủ", "Phú nông, trung, tiểu địa chủ và tư bản An Nam", "Tiểu tư sản, trí thức, trung nông, Thanh niên, Tân Việt", "Phú nông, tư bản An Nam"], "a": 2, "note": ["Phú nông, trung, tiểu địa chủ, tư bản An Nam (chưa rõ mặt phản cách mạng) thì phải lợi dụng, ít lâu mới làm cho họ trung lập."]}, {"n": 7, "src": "Đề 101 câu 7 · 1.1.1. Khái niệm tư tưởng Hồ Chí Minh", "ch": 1, "q": "Tìm từ, cụm từ KHÔNG ĐÚNG trong những từ, cụm từ được gạch chân ở câu sau: “Tư tưởng Hồ Chí Minh là tài sản tinh thần vô cùng to lớn và vô giá của Đảng và dân tộc ta, mãi mãi soi đường cho sự nghiệp cách mạng của nhân dân ta giành thắng lợi”.", "o": ["Vô cùng to lớn", "Của nhân dân ta", "Vô giá", "Dân tộc ta"], "a": 2, "note": ["Đúng là: “tài sản tinh thần vô cùng to lớn và QUÝ GIÁ”."]}, {"n": 8, "src": "Đề 101 câu 8 · 3.1.1.3. Độc lập thật sự, hoàn toàn, triệt để", "ch": 3, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: Khi trả lời ông Vaxiđéprao, thông tín viên hãng Roitơ, Hồ Chí Minh khẳng định: “Độc lập nghĩa là chúng tôi điều khiển lấy mọi công việc của chúng tôi, [...]”.", "o": ["Tự lựa chọn con đường phát triển cho phù hợp với xu thế của thời đại", "Không có sự can thiệp ở ngoài vào", "Tự quyết định con đường phát triển của chúng tôi", "Phù hợp với điều kiện nước tôi"], "a": 1, "note": []}, {"n": 9, "src": "Đề 101 câu 9 · 2.2.2. Thời kỳ 1911–1920", "ch": 2, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Lúc đầu, chính là [...] chứ chưa phải chủ nghĩa cộng sản đã đưa tôi tin theo Lênin, tin theo Quốc tế thứ ba”.", "o": ["Chủ nghĩa cộng sản", "Chủ nghĩa Mác-Lênin", "Cộng sản chủ nghĩa", "Chủ nghĩa yêu nước"], "a": 3, "note": ["Trích “Con đường dẫn tôi đến chủ nghĩa Lênin” (1960)."]}, {"n": 10, "src": "Đề 101 câu 10 · 3.2.3. Thời kỳ quá độ lên CNXH", "ch": 3, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Cộng sản có 2 giai đoạn, giai đoạn thấp tức là [...], giai đoạn cao là [...]” (Trong tác phẩm: Thường thức chính trị – 45. Chủ nghĩa xã hội).", "o": ["Cách mạng giải phóng dân tộc, Chủ nghĩa xã hội", "Thời kỳ quá độ, Chủ nghĩa cộng sản", "Chủ nghĩa tư bản, Chủ nghĩa cộng sản", "Chủ nghĩa xã hội, Chủ nghĩa cộng sản"], "a": 3, "note": []}, {"n": 11, "src": "Đề 101 câu 11 · 7.3.3. Xây dựng con người", "ch": 7, "q": "Trong tác phẩm “Xây dựng những con người của chủ nghĩa xã hội”, “những tư tưởng, tác phong mới mà Đảng ta yêu cầu mỗi cán bộ, mỗi đảng viên và mỗi người lao động cần phải bồi dưỡng” được Hồ Chí Minh tóm tắt như thế nào?", "o": ["Có ý thức làm chủ và tinh thần tập thể xã hội chủ nghĩa", "Quan điểm “tất cả phục vụ sản xuất”, ý thức cần kiệm xây dựng nước nhà", "Tất cả phương án", "Tinh thần tiến nhanh, tiến mạnh, tiến vững chắc lên chủ nghĩa xã hội"], "a": 2, "note": ["Trên đề có gạch bỏ A, chọn C."]}, {"n": 12, "src": "Đề 101 câu 12 · 7.4. Vận dụng – xây dựng văn hóa, con người", "ch": 7, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: Vận dụng tư tưởng Hồ Chí Minh về con người, Đảng ta tại Hội nghị TW 9 khóa XI (2014) khẳng định: “Xây dựng nền văn hóa và con người Việt Nam [...] thấm nhuần tinh thần dân tộc, nhân văn, dân chủ và khoa học”.", "o": ["Phát triển toàn diện, cuộc sống ngày càng văn minh, tiến bộ", "Phát triển toàn diện, đời sống ngày càng cao", "Phát triển toàn diện, hướng đến chân - thiện - mỹ", "Phát triển toàn diện, hướng các giá trị cao đẹp"], "a": 2, "note": []}, {"n": 13, "src": "Đề 101 câu 13 · 6.1.2. Lực lượng đại đoàn kết dân tộc", "ch": 6, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Đại đoàn kết tức là trước hết phải đoàn kết đại đa số nhân dân, mà đại đa số [...] là công nhân, nông dân và các tầng lớp nhân dân lao động khác. Đó là [...] của đại đoàn kết”.", "o": ["Nhân dân - điểm tựa", "Toàn dân - điểm tựa", "Toàn dân - nền, gốc", "Nhân dân - nền, gốc"], "a": 3, "note": []}, {"n": 14, "src": "Đề 101 câu 14 · 7.3.3. Xây dựng con người", "ch": 7, "q": "Theo Hồ Chí Minh, để thực hiện chiến lược “trồng người” cần có nhiều biện pháp, nhưng biện pháp quan trọng bậc nhất là:", "o": ["Giáo dục - Đào tạo", "Giáo dục", "Răn đe", "Dạy dỗ"], "a": 0, "note": []}, {"n": 15, "src": "Đề 101 câu 15 · 3.1.1.4. Độc lập gắn với thống nhất, toàn vẹn lãnh thổ", "ch": 3, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Nước Việt Nam là một khối thống nhất về mặt [...] và không một lực lượng nào trên thế giới có thể chia cắt nổi Việt Nam”.", "o": ["Lãnh thổ", "Dân tộc, lịch sử và kinh tế", "Tư tưởng", "Chính trị"], "a": 1, "note": []}, {"n": 16, "src": "Đề 101 câu 16 · 7.2. Đạo đức – cần, kiệm, liêm, chính", "ch": 7, "q": "Điểm tóm tắt nào sau đây viết CHƯA ĐÚNG khi giải thích quan điểm của Hồ Chí Minh về cần, kiệm, liêm, chính?", "o": ["Cần là lao động cần cù, siêng năng, lao động có kế hoạch, sáng tạo và có năng suất lao động cao", "Kiệm là không xa xỉ, không hoang phí, không bừa bãi", "Liêm là liêm khiết, trong sạch, luôn tôn trọng của công và của dân, không tham lam địa vị, tiền của, danh tiếng", "Chính là trong sạch, không tham lam đồng xu, hạt thóc của nhà nước, của dân"], "a": 3, "note": ["“Chính” là thẳng thắn, đứng đắn; còn “trong sạch, không tham lam” thuộc về Liêm."]}, {"n": 17, "src": "Đề 101 câu 17 · 7.2.1.1. Vai trò và sức mạnh của đạo đức", "ch": 7, "q": "Theo Hồ Chí Minh, đạo đức là nhân tố tạo nên:", "o": ["Sức mạnh sức hấp dẫn của chủ nghĩa Mác - Lênin", "Sức hấp dẫn của chủ nghĩa xã hội", "Sức mạnh sức hấp dẫn của tư tưởng Hồ Chí Minh", "Sức mạnh sức hấp dẫn của con người mới xã hội chủ nghĩa"], "a": 1, "note": []}, {"n": 18, "src": "Đề 101 câu 18 · 7.1.2. Vị trí, vai trò của văn hóa", "ch": 7, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Văn hóa – văn nghệ là một [...], nghệ sĩ là [...] tác phẩm văn nghệ là [...] trong đấu tranh cách mạng”.", "o": ["Mặt trận, thi sĩ, sản phẩm tinh thần", "Mặt trận, chủ thể, sản phẩm tinh thần", "Hình thái ý thức xã hội, chiến sĩ, vũ khí", "Mặt trận, chiến sĩ, vũ khí sắc bén"], "a": 3, "note": []}, {"n": 19, "src": "Đề 101 câu 19 · 3.2.1.3. Đặc trưng của CNXH", "ch": 3, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: Khi đề cập đến chế độ sở hữu công cộng trong xã hội xã hội chủ nghĩa, Hồ Chí Minh khẳng định: “chủ nghĩa xã hội là lấy nhà máy, xe lửa, ngân hàng, ... [...]”.", "o": ["Sở hữu chung", "Làm của nhân dân lao động", "Làm của chung", "Làm của dân"], "a": 2, "note": []}, {"n": 20, "src": "Đề 101 câu 20 · 2.2.2. Tìm thấy con đường cứu nước", "ch": 2, "q": "Hồ Chí Minh lựa chọn con đường cách mạng vô sản trên cơ sở:", "o": ["Thực tiễn nghiên cứu, phân tích những phong trào cách mạng ở trong nước cuối thế kỷ XIX, đầu thế kỷ XX", "Nghiên cứu và tiếp thu lý luận của chủ nghĩa Mác-Lênin", "Tất cả phương án", "Nghiên cứu, khảo nghiệm các xu hướng, ngả đường cách mạng lớn trên thế giới trong hành trình tìm đường cứu nước"], "a": 2, "note": []}, {"n": 21, "src": "Đề 101 câu 21 · 7.2. Đạo đức (tác phẩm)", "ch": 7, "q": "Tác phẩm Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân của Hồ Chí Minh có bút danh gì?", "o": ["X.Y.Z", "Trần Lực", "Hồ Chí Minh", "T.L"], "a": 3, "note": ["Tác phẩm viết năm 1969, ký bút danh T.L."]}, {"n": 22, "src": "Đề 101 câu 22 · 3.1.2.3. Lực lượng cách mạng (Đường Kách mệnh)", "ch": 3, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Học trò, nhà buôn nhỏ, điền chủ nhỏ cũng bị tư bản áp bức, song không cực khổ bằng công nông; ba hạng ấy chỉ là [...] cách mệnh của công nông thôi”.", "o": ["Bầu bạn", "Người dẫn đường", "Người ủng hộ", "Bạn đồng minh"], "a": 0, "note": ["Câu này xuất hiện 2 lần trong đề 101 (câu 22 và câu 58)."]}, {"n": 23, "src": "Đề 101 câu 23 · Sách lược vắn tắt của Đảng (1930)", "ch": 3, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: Trong tác phẩm “Sách lược vắn tắt” của Đảng, Hồ Chí Minh khẳng định: “Bộ phận nào mà ra mặt phản cách mạng [...] thì phải đánh đổ”.", "o": ["Tân Việt Cách mạng đảng", "Đảng Lập hiến", "Việt Nam Quốc dân đảng", "Đảng Việt Cách"], "a": 1, "note": ["Ảnh chụp trang này hơi mờ; đáp án được đối chiếu với giáo trình (Sách lược vắn tắt, điểm 4)."]}, {"n": 24, "src": "Đề 101 câu 24 · 2.2.1. Thời kỳ trước 1911", "ch": 2, "q": "Nguyễn Tất Thành nói: “Tôi muốn đi ra nước ngoài xem nước Pháp và các nước khác làm như thế nào, tôi sẽ trở về giúp đồng bào chúng ta”, vào thời gian nào?", "o": ["6/1912", "6/1908", "6/1909", "6/1911"], "a": 3, "note": []}, {"n": 25, "src": "Đề 101 câu 25 · 4.2.2. Công tác cán bộ (Sửa đổi lối làm việc)", "ch": 4, "q": "Trong phần về “Vấn đề cán bộ” của tác phẩm “Sửa đổi lối làm việc” (1947), Hồ Chí Minh đưa ra mấy nội dung huấn luyện cán bộ?", "o": ["4 nội dung", "2 nội dung", "5 nội dung", "3 nội dung"], "a": 0, "note": ["Huấn luyện nghề nghiệp, chính trị, văn hóa, lý luận."]}, {"n": 26, "src": "Đề 101 câu 26 · 5.1.3. Nhà nước vì dân", "ch": 5, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: Trong bài “Phải tẩy sạch bệnh quan liêu”, Người nhấn mạnh: “Đã phụng sự nhân dân, thì phải phụng sự cho ra trò. Nghĩa là việc gì có lợi cho dân, [...]. Việc gì hại cho dân, thì phải hết sức tránh”.", "o": ["Thì nên làm", "Thì phải làm cho kỳ được", "Thì phải hết sức làm", "Thì hãy cố gắng làm"], "a": 2, "note": []}, {"n": 27, "src": "Đề 101 câu 27 · 3.2.3.2. Nội dung xây dựng CNXH – kinh tế", "ch": 3, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Nông dân ta giàu thì nước ta giàu, [...] ta thịnh thì nước ta thịnh”.", "o": ["Nông nghiệp", "Nông dân", "Thương nghiệp", "Công nghiệp"], "a": 0, "note": []}, {"n": 28, "src": "Đề 101 câu 28 · 5.5. Vận dụng – xây dựng Nhà nước", "ch": 5, "q": "Vận dụng tư tưởng Hồ Chí Minh về Nhà nước Việt Nam trong xây dựng Nhà nước ngang tầm nhiệm vụ cách mạng trong giai đoạn hiện nay, chúng ta cần phải làm gì?", "o": ["Đổi mới, tăng cường sự lãnh đạo của Đảng đối với Nhà nước", "Xây dựng Nhà nước thật sự trong sạch, vững mạnh", "Tất cả các phương án", "Xây dựng Nhà nước bảo đảm quyền làm chủ thật sự của nhân dân"], "a": 2, "note": ["Đúng 3 tiểu mục 5.5.1–5.5.3 của giáo trình."]}, {"n": 29, "src": "Đề 101 câu 29 · 2.2.1. Thời kỳ trước 1911", "ch": 2, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Khi tôi độ [...] lần đầu tiên tôi được nghe ba chữ Pháp: Tự do, Bình đẳng, Bác ái. Đối với chúng tôi, người da trắng nào cũng là người Pháp. Người Pháp đã nói thế. Và từ thuở ấy, tôi rất muốn làm quen với nền văn minh Pháp, muốn tìm xem những gì ẩn đằng sau những chữ ấy”.", "o": ["Mười bốn tuổi", "Mười ba tuổi", "Mười lăm tuổi", "Mười sáu tuổi"], "a": 1, "note": []}, {"n": 30, "src": "Đề 101 câu 30 · 7.4.2. Xây dựng đạo đức, con người – thanh niên", "ch": 7, "q": "Tìm phương án đúng nhất với tư tưởng Hồ Chí Minh trong các câu sau đây:", "o": ["Thanh niên là người tiếp sức cách mạng cho thế hệ thanh niên già, đồng thời là người phụ trách, dìu dắt thế hệ thanh niên tương lai", "Thanh niên là người tiếp bước cách mạng cho thế hệ thanh niên già, đồng thời là người phụ trách, dìu dắt thế hệ thanh niên tương lai", "Thanh niên là người tiếp nối cách mạng cho thế hệ thanh niên già, đồng thời là người phụ trách, dìu dắt thế hệ thanh niên tương lai", "Thanh niên là người kế thừa cách mạng cho thế hệ thanh niên già, đồng thời là người phụ trách, dìu dắt thế hệ thanh niên tương lai"], "a": 0, "note": ["Từ khóa: “tiếp sức”."]}, {"n": 31, "src": "Đề 101 câu 31 · 6.1.4. Nguyên tắc đại đoàn kết dân tộc", "ch": 6, "q": "Theo Hồ Chí Minh, một trong những nguyên tắc để đại đoàn kết dân tộc là:", "o": ["Bảo đảm những lợi ích tối cao của giai cấp công nhân và những quyền lợi cơ bản của nhân dân lao động", "Bảo đảm những lợi ích tối cao của dân tộc và những quyền lợi cơ bản của giai cấp công nhân", "Bảo đảm những lợi ích tối cao của dân tộc và những quyền lợi cơ bản của nhân dân lao động", "Bảo đảm những lợi ích tối cao của nhân dân lao động và những quyền lợi cơ bản của giai cấp công nhân"], "a": 2, "note": []}, {"n": 32, "src": "Đề 101 câu 32 · 1.1.1. Quá trình nhận thức của Đảng về TT HCM", "ch": 1, "q": "Sự phát triển trong nhận thức của Đảng về tư tưởng Hồ Chí Minh thể hiện rõ qua những kỳ Đại hội nào?", "o": ["Đại hội IX (4-2001), X (4-2006), XI (1-2011)", "Đại hội VII (6-1991), VIII (6-1996), IX (4-2001)", "Đại hội VI (12-1986), VII (6-1991), VIII (6-1996)", "Đại hội VII (6-1991), IX (4-2001), XI (1-2011)"], "a": 3, "note": []}, {"n": 33, "src": "Đề 101 câu 33 · 5.1.3 / 7.2 – Cán bộ đủ đức và tài", "ch": 5, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: Theo Hồ Chí Minh, người cán bộ phải có [...] và tài, [...] và năng lực.", "o": ["Đức - Phẩm chất", "Phẩm chất - Đức", "Đức - Chuyên môn", "Chuyên môn - phẩm chất"], "a": 0, "note": ["Ảnh đề 101 bị cắt mép trái; phương án A–C được bổ sung từ đề 202 (cùng câu). Trên đề có ghi tay “ĐỨC”."]}, {"n": 34, "src": "Đề 101 câu 34 · 4.1.1.2. Vai trò lãnh đạo của Đảng", "ch": 4, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Muốn khỏi đi lạc phương hướng, quần chúng phải có Đảng lãnh đạo để [...], đường lối và định phương châm cho đúng”.", "o": ["Nhận rõ tình hình", "Tổ chức quần chúng đấu tranh", "Tập hợp quần chúng", "Hướng dẫn quần chúng"], "a": 0, "note": ["Ảnh đề 101 bị cắt mép trái; phương án bổ sung từ đề 202."]}, {"n": 35, "src": "Đề 101 câu 35 · 7.3. Con người – Di chúc", "ch": 7, "q": "Trong Di chúc, Hồ Chí Minh xác định công việc đầu tiên là công việc gì?", "o": ["Phát triển kinh tế", "Công việc đối với con người", "Phát triển khoa học - kỹ thuật", "Ra sức phát triển văn hóa"], "a": 1, "note": ["Ảnh đề 101 chỉ thấy A, B; phương án C, D lấy từ đề 202."]}, {"n": 36, "src": "Đề 101 câu 36 · 7.1.2. Vị trí, vai trò của văn hóa", "ch": 7, "q": "Trong tư tưởng Hồ Chí Minh: Văn hóa có mối quan hệ mật thiết với những lĩnh vực nào của đời sống xã hội?", "o": ["Với xã hội", "Với kinh tế", "Tất cả các phương án", "Với chính trị"], "a": 2, "note": []}, {"n": 37, "src": "Đề 101 câu 37 · 3.1.1.2. Độc lập gắn với cơm no, áo ấm, hạnh phúc", "ch": 3, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Tôi chỉ có một sự ham muốn, ham muốn tột bậc, là làm sao cho nước ta được hoàn toàn độc lập, dân ta được hoàn toàn tự do, đồng bào ai cũng có [...]”.", "o": ["Độc lập, tự do", "Cơm ăn áo mặc, ai cũng được học hành", "Hạnh phúc", "Tất cả phương án"], "a": 1, "note": []}, {"n": 38, "src": "Đề 101 câu 38 · 3.1.1.1. Độc lập, tự do là quyền thiêng liêng", "ch": 3, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: Theo Hồ Chí Minh, “[...] là quyền thiêng liêng, bất khả xâm phạm của tất cả các dân tộc”.", "o": ["Độc lập dân tộc", "Quyền tự quyết dân tộc", "Độc lập, tự do", "Quyền dân chủ của nhân dân"], "a": 2, "note": []}, {"n": 39, "src": "Đề 101 câu 39 · 5.1.2. Nhà nước do dân", "ch": 5, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Mong [...] giúp đỡ, đôn đốc, kiểm soát và phê bình để làm trọn nhiệm vụ của mình là người đầy tớ trung thành tận tụy của nhân dân”.", "o": ["Đồng bào", "Quần chúng", "Nhân dân", "Quốc dân"], "a": 0, "note": []}, {"n": 40, "src": "Đề 101 câu 40 · 2.1.1.2. Tiền đề lý luận – chủ nghĩa Mác-Lênin", "ch": 2, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Chủ nghĩa Lênin đối với chúng ta, những người cách mạng và nhân dân Việt Nam, không những là [...] không những là cái kim chỉ nam, mà còn là mặt trời soi sáng con đường chúng ta đi tới thắng lợi cuối cùng, đi tới chủ nghĩa xã hội và chủ nghĩa cộng sản”.", "o": ["Định hướng thần kỳ", "Cái cẩm nang thần kỳ", "Học thuyết thần kỳ", "Lý luận thần kỳ"], "a": 1, "note": []}, {"n": 41, "src": "Đề 101 câu 41 · 3.1.2.1. Con đường cách mạng vô sản (Chánh cương vắn tắt)", "ch": 3, "q": "Phương hướng chiến lược của cách mạng Việt Nam mà Nguyễn Ái Quốc (Hồ Chí Minh) xác định trong tác phẩm Chánh cương vắn tắt của Đảng là:", "o": ["Làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội tư bản", "Làm cách mạng tư sản và thổ địa cách mạng để đi tới xây dựng chủ nghĩa tư bản", "Làm tư sản dân quyền cách mạng để đi tới xã hội cộng sản", "Làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản"], "a": 3, "note": []}, {"n": 42, "src": "Đề 101 câu 42 · 5.1.2. Nhà nước do dân", "ch": 5, "q": "Theo Hồ Chí Minh, nhà nước do dân thể hiện ở chỗ:", "o": ["Tất cả phương án", "Do nhân dân ủng hộ", "Do nhân dân lập nên", "Do nhân dân làm chủ"], "a": 0, "note": []}, {"n": 43, "src": "Đề 101 câu 43 · 3.3. Quan hệ độc lập dân tộc – CNXH", "ch": 3, "q": "Nội dung cốt lõi nhất trong tư tưởng Hồ Chí Minh là:", "o": ["Tư tưởng về cách mạng giải phóng dân tộc", "Tư tưởng về giải phóng giai cấp", "Tư tưởng về độc lập dân tộc gắn liền với chủ nghĩa xã hội", "Tư tưởng về chủ nghĩa xã hội"], "a": 2, "note": []}, {"n": 44, "src": "Đề 101 câu 44 · 3.2.1.2. Quan niệm của Hồ Chí Minh về CNXH", "ch": 3, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Chỉ có chủ nghĩa cộng sản mới cứu [...] đem lại cho mọi người không phân biệt chủng tộc và nguồn gốc sự tự do, bình đẳng, bác ái, đoàn kết, ấm no trên quả đất, việc làm cho mọi người và vì mọi người, niềm vui, hoà bình, hạnh phúc”.", "o": ["Con người", "Loài người", "Nhân dân", "Nhân loại"], "a": 3, "note": []}, {"n": 45, "src": "Đề 101 câu 45 · 5.3.2. Nhà nước thượng tôn pháp luật", "ch": 5, "q": "Theo Hồ Chí Minh, để xây dựng Nhà nước thượng tôn pháp luật phải:", "o": ["Đảm bảo cho pháp luật được thi hành và có cơ chế giám sát việc thi hành pháp luật", "Làm tốt công tác lập hiến và lập pháp", "Tất cả các phương án", "Cần chú trọng đưa pháp luật vào cuộc sống"], "a": 2, "note": []}, {"n": 46, "src": "Đề 101 câu 46 · 3.1.1.2. Độc lập gắn với tự do, hạnh phúc", "ch": 3, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Cả đời tôi chỉ có một mục đích, là phấn đấu cho quyền lợi Tổ quốc, và hạnh phúc của quốc dân. Những khi tôi phải ẩn nấp nơi núi non, hoặc vào chốn tù tội, xông pha sự hiểm nghèo là vì mục đích đó. Đến lúc nhờ quốc dân [...] (1), tranh được [...] (2), uỷ thác cho tôi gánh việc Chính phủ, tôi lo lắng đêm ngày, nhẫn nhục cố gắng cũng vì mục đích đó”.", "o": ["1. Đoàn kết, 2. Độc lập", "1. Đấu tranh, 2. Nhà nước", "1. Đấu tranh, 2. Chính quyền", "1. Đoàn kết, 2. Chính quyền"], "a": 3, "note": []}, {"n": 47, "src": "Đề 101 câu 47 · 7.2. Đạo đức – rèn luyện", "ch": 7, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Đạo đức cách mạng không phải trên trời sa xuống. Nó do đấu tranh, rèn luyện bền bỉ hàng ngày mà phát triển và củng cố. Cũng như [...] càng mài càng sáng, [...] càng luyện càng trong”.", "o": ["Đá - vàng", "Vàng - đá", "Vàng - ngọc", "Ngọc - vàng"], "a": 3, "note": []}, {"n": 48, "src": "Đề 101 câu 48 · 6.1.4. Khoan dung, độ lượng", "ch": 6, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Trong mấy triệu người cũng có người thế này, thế khác, nhưng thế này hay thế khác đều dòng dõi của tổ tiên ta vậy nên ta phải [...]”.", "o": ["Khoan hồng đại độ", "Yêu thương giúp đỡ", "Đoàn kết thống nhất", "Bỏ qua thành kiến"], "a": 0, "note": []}, {"n": 49, "src": "Đề 101 câu 49 · 3.1.2.4. Cách mạng GPDT cần chủ động, sáng tạo", "ch": 3, "q": "Kết luận: “Muốn được giải phóng, các dân tộc chỉ có thể trông cậy vào mình, trông cậy vào lực lượng của bản thân mình”, được Hồ Chí Minh đưa ra khi nào?", "o": ["Bản yêu sách 8 điểm của nhân dân An Nam gửi đến Hội nghị Vécxây (1919) không được chấp thuận", "Tất cả phương án", "Hoạt động ở các nước châu Phi", "Nhìn thấy sự thất bại của phong trào đấu tranh giải phóng dân tộc theo khuynh dân chủ tư sản"], "a": 0, "note": []}, {"n": 50, "src": "Đề 101 câu 50 · 4.2.2. Xây dựng đội ngũ đảng viên", "ch": 4, "q": "“Tôn trọng và phát huy quyền làm chủ của nhân dân; tiên phong, gương mẫu, chịu khổ trước nhân dân và vui sau nhân dân”, là yêu cầu mà Hồ Chí Minh đặt ra đối với đối tượng nào?", "o": ["Bộ đội", "Giai cấp công nhân", "Đảng viên", "Cán bộ quản lý"], "a": 2, "note": []}, {"n": 51, "src": "Đề 101 câu 51 · 6.1.4. Khoan dung, độ lượng", "ch": 6, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Trong mấy triệu người cũng có người thế này thế khác nhưng thế này hay thế khác đều dòng dõi của tổ tiên ta. Vậy nên ta phải khoan hồng đại độ. Ta phải nhận rằng đã là [...] thì ai cũng có ít hay nhiều lòng ái quốc”.", "o": ["Dòng dõi tổ tiên ta", "Dân tộc Việt Nam", "Con Lạc cháu Hồng", "Người dân một nước"], "a": 2, "note": []}, {"n": 52, "src": "Đề 101 câu 52 · 6.1.4. Khoan dung, độ lượng", "ch": 6, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Vì lợi ích của cách mạng, cần phải có lòng khoan dung, độ lượng, trân trọng cái phần [...] dù nhỏ nhất ở mỗi con người mới có thể tập hợp, quy tụ rộng rãi mọi lực lượng”.", "o": ["Ưu điểm", "Tích cực", "Tốt", "Thiện"], "a": 3, "note": []}, {"n": 53, "src": "Đề 101 câu 53 · 2.3.2.1. Giá trị đối với nhân loại", "ch": 2, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Tư tưởng Hồ Chí Minh mở ra cho các dân tộc thuộc địa con đường giải phóng dân tộc gắn với giải phóng giai cấp và [...]”.", "o": ["Giải phóng con người", "Giải phóng người bị áp bức", "Giải phóng người cùng khổ", "Giải phóng người nô lệ"], "a": 0, "note": []}, {"n": 54, "src": "Đề 101 câu 54 · 2.2.4. Thời kỳ 1930–1941", "ch": 2, "q": "Ai là người có công lớn trong việc cứu Nguyễn Ái Quốc ra khỏi nhà tù của thực dân Anh ở Hồng Kông?", "o": ["Luật sư Phan Văn Trường", "Luật sư Lôdơbai", "Tô mát Xautôn (phó Thống đốc Hồng Kông)", "Luật sư Nôoen Prit"], "a": 1, "note": ["Luật sư Frank Loseby (Lôdơbai), 1931–1933. Chi tiết này không có trong bài giảng."]}, {"n": 55, "src": "Đề 101 câu 55 · 4.2.2. Xây dựng Đảng về tư tưởng, lý luận", "ch": 4, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: Theo Hồ Chí Minh: “Đảng muốn vững thì phải có chủ nghĩa làm cốt, trong Đảng ai cũng phải hiểu, ai cũng phải theo chủ nghĩa ấy. Đảng mà không có chủ nghĩa cũng như người [...]”.", "o": ["Mất trí khôn, tàu không có bàn chỉ nam", "Mất phương hướng", "Không có trí khôn, tàu không có bàn chỉ nam", "Đi giữa đêm tối, không thấy đường"], "a": 2, "note": ["Câu 55 và 56 cùng nội dung, chỉ đảo phương án. Bẫy: “MẤT trí khôn” sai, đúng là “KHÔNG CÓ trí khôn”."]}, {"n": 56, "src": "Đề 101 câu 56 · 4.2.2. Xây dựng Đảng về tư tưởng, lý luận", "ch": 4, "q": "(Lặp lại câu 55, đảo phương án) “Đảng muốn vững thì phải có chủ nghĩa làm cốt, trong Đảng ai cũng phải hiểu, ai cũng phải theo chủ nghĩa ấy. Đảng mà không có chủ nghĩa cũng như người [...]”.", "o": ["Mất phương hướng", "Mất trí khôn, tàu không có bàn chỉ nam", "Đi giữa đêm tối, không thấy đường", "Không có trí khôn, tàu không có bàn chỉ nam"], "a": 3, "note": []}, {"n": 57, "src": "Đề 101 câu 57 · 2.2.2. Thời kỳ 1911–1920", "ch": 2, "q": "Từ những cuộc bàn cãi của các chi bộ Đảng Xã hội Pháp, điều mà Nguyễn Ái Quốc muốn được nghe người ta thảo luận nhất là điều gì? (Tác phẩm “Con đường dẫn tôi đến chủ nghĩa Lênin”).", "o": ["Quốc tế nào bênh vực nhân dân các nước thuộc địa", "Quốc tế II có thể chống lại chủ nghĩa đế quốc", "Quốc tế hai rưỡi bênh vực nhân dân thuộc địa", "Tất cả phương án"], "a": 0, "note": []}, {"n": 58, "src": "Đề 101 câu 58 · 3.1.2.3. Lực lượng cách mạng (Đường Kách mệnh)", "ch": 3, "q": "(Lặp lại câu 22) “Học trò, nhà buôn nhỏ, điền chủ nhỏ cũng bị tư bản áp bức, song không cực khổ bằng công nông; ba hạng ấy chỉ là [...] cách mệnh của công nông thôi”.", "o": ["Bầu bạn", "Người dẫn đường", "Người ủng hộ", "Bạn đồng minh"], "a": 0, "note": []}, {"n": 59, "src": "Đề 101 câu 59 · 7.2. Đạo đức cũ và đạo đức mới", "ch": 7, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Đạo đức cũ như người [...] Đạo đức mới như người hai chân đứng vững được dưới đất, đầu ngửng lên trời”.", "o": ["Đầu ngược xuống đất", "Chân chổng lên trời", "Đầu ngược xuống đất, chân chổng lên trời", "Hai chân đứng vững dưới đất"], "a": 2, "note": []}, {"n": 60, "src": "Đề 101 câu 60 · 5.1.1. Nhà nước của dân", "ch": 5, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: “Nước Việt Nam là một nước dân chủ cộng hoà, tất cả quyền bính trong nước là của toàn thể nhân dân Việt Nam, không phân biệt nòi giống, gái trai, giàu u [...]: “Người ta sinh ra tự do và bình đẳng về quyền lợi, và phải luôn luôn được tự do và bình đẳng về quyền lợi. Đó là [...]”.", "o": ["Là điều không ai chối cãi được", "Là quyền thiêng liêng, bất khả xâm phạm", "Những lẽ phải không ai chối cãi được", "Là lẽ phải không ai chối cãi được"], "a": 2, "note": ["Trên đề gạch bỏ D, chọn C."]}, {"n": 65, "src": "Đề 101 câu 65 · 2.2.2. Thời kỳ 1911–1920", "ch": 2, "q": "Vì sao Nguyễn Ái Quốc tán thành Đệ tam quốc tế (Quốc tế III – Quốc tế Cộng sản)?", "o": ["Quốc tế III đấu tranh cho giai cấp tư sản", "Quốc tế II phân rã", "Quốc tế III ủng hộ cuộc đấu tranh của giai cấp công nhân", "Quốc tế III quan tâm đến vấn đề thuộc địa"], "a": 3, "note": []}, {"n": 66, "src": "Đề 101 câu 66 · 5.1.3. Nhà nước vì dân – Chính phủ là công bộc", "ch": 5, "q": "Trong tác phẩm “Chính phủ là công bộc của dân”, theo Chủ tịch Hồ Chí Minh, Chính phủ đối với ta giống như?", "o": ["Người anh cả trong gia đình", "Tất cả phương án", "Một đồng chí phụ trách trong một địa phương", "Một người đứng mũi chịu sào ta có thể vững lòng trông cậy và gửi số mệnh vào"], "a": 1, "note": []}, {"n": 67, "src": "Đề 101 câu 67 · 7.1.2. Vai trò của văn hóa – động lực", "ch": 7, "q": "Trong các động lực văn hóa sau đây, động lực nào góp phần giúp con người hiểu biết các quy luật xã hội, đào tạo con người mới, nguồn nhân lực cho cách mạng?", "o": ["Văn hóa chính trị", "Văn hóa, văn nghệ", "Văn hóa pháp luật", "Văn hóa giáo dục"], "a": 3, "note": []}, {"n": 68, "src": "Đề 101 câu 68 · 3.2.3.3. Nguyên tắc, biện pháp xây dựng CNXH", "ch": 3, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: Theo Hồ Chí Minh: Muốn cải tạo xã hội chủ nghĩa thì phải cải tạo chính mình, nếu không có tư tưởng xã hội chủ nghĩa thì [...].", "o": ["Tất cả phương án", "Không làm việc xã hội chủ nghĩa được", "Không có khoa học kỹ thuật tiên tiến", "Không có nền kinh tế phát triển"], "a": 1, "note": []}, {"n": 69, "src": "Đề 101 câu 69 · 7.3.3. Xây dựng con người", "ch": 7, "q": "Điền từ hoặc cụm từ đúng vào dấu [...]: Trong bài “Xây dựng những con người của chủ nghĩa xã hội”, Hồ Chí Minh nhấn mạnh: “Đợt chỉnh huấn lần này là một cuộc vận động lớn về tư tưởng trong Đảng và trong nhân dân lao động nhằm [...]”.", "o": ["Xây dựng những con người của chủ nghĩa xã hội", "Xây dựng những con người của chủ nghĩa xã hội và có tác phong xã hội chủ nghĩa", "Xây dựng những con người có tác phong xã hội chủ nghĩa", "Xây dựng đất nước giàu mạnh, dân chủ, công bằng, văn minh"], "a": 1, "note": []}, {"n": 70, "src": "Đề 101 câu 70 · 7.1.3. Xây dựng nền văn hóa mới", "ch": 7, "q": "Theo Hồ Chí Minh, nội dung của tiếp thu tinh hoa văn hóa nhân loại là:", "o": ["Những giá trị văn hóa phương Đông", "Toàn diện bao gồm Đông, Tây, kim, cổ, tất cả các mặt, các khía cạnh", "Cả những mặt tích cực và hạn chế của văn hóa nhân loại", "Những giá trị văn hóa phương Tây"], "a": 1, "note": []}];
const L = 'ABCD', KEY = 'tthcm-giay-v1';
let st = {ch: 47, mode: 'quiz', order: [], i: 0, ans: {}, optOrd: {}, flip: {}};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.order) st = s; } catch (e) {}
const $ = id => document.getElementById(id);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const byN = n => ALL.find(q => q.n === n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function start(list, mix) {
  st.order = mix ? shuffle(list.slice()) : list.slice();
  st.i = 0; st.ans = {}; st.flip = {}; st.optOrd = {};
  save(); render();
}
const inCh = (q, ch) => !ch || (ch === 13 ? q.ch <= 3 : ch === 47 ? q.ch >= 4 : q.ch === ch);
const pool = () => ALL.filter(q => inCh(q, st.ch)).map(q => q.n);
function optOrder(q) {
  // "Tất cả phương án" giữ nguyên vị trí gốc nên không trộn phương án; chỉ trộn thứ tự câu
  return [0, 1, 2, 3];
}
function esc(s) { return s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c])); }
function render() {
  document.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', +b.dataset.ch === st.ch));
  $('mode').textContent = 'Chế độ: ' + (st.mode === 'quiz' ? 'trắc nghiệm' : 'lật thẻ');
  const n = st.order.length, done = Object.keys(st.ans).length;
  const right = st.order.filter(k => st.ans[k] === byN(k).a).length;
  $('stat').textContent = st.mode === 'quiz' ? `Câu ${Math.min(st.i + 1, n)}/${n} · đúng ${right} · sai ${done - right}` : `Thẻ ${Math.min(st.i + 1, n)}/${n}`;
  $('prog').style.width = (n ? (st.mode === 'quiz' ? done : st.i + 1) / n * 100 : 0) + '%';
  $('wrong').disabled = !st.order.some(k => k in st.ans && st.ans[k] !== byN(k).a);
  const c = $('card');
  if (!n) { c.innerHTML = 'Không có câu nào.'; return; }
  if (st.i >= n) {
    const bad = st.order.filter(k => k in st.ans && st.ans[k] !== byN(k).a);
    c.innerHTML = `<div class="done"><h2>Xong lượt này: đúng ${right}/${n}</h2>` +
      (bad.length ? `<p>Các câu sai, kèm đáp án đúng:</p><ul>${bad.map(k => { const q = byN(k); return `<li>${esc(q.q)}<br><b>${L[q.a]}. ${esc(q.o[q.a])}</b></li>`; }).join('')}</ul>` : '<p>Không sai câu nào.</p>') +
      `<div class="nav"><button onclick="go(-1)">← Xem lại</button></div></div>`;
    return;
  }
  const q = byN(st.order[st.i]), picked = st.ans[q.n], shown = st.mode === 'quiz' ? picked !== undefined : !!st.flip[q.n];
  let h = `<div class="meta">Chương ${q.ch} · ${esc(q.src)}</div><div class="q">${esc(q.q)}</div>`;
  optOrder(q).forEach(k => {
    let cls = 'opt';
    if (shown && k === q.a) cls += ' ok';
    else if (shown && k === picked) cls += ' bad';
    h += `<button class="${cls}" ${st.mode === 'quiz' && !shown ? `onclick="pick(${k})"` : 'disabled'}><b>${L[k]}.</b><span>${esc(q.o[k])}</span></button>`;
  });
  if (st.mode === 'quiz') h += `<div class="msg ${shown ? (picked === q.a ? 'ok' : 'bad') : ''}">${shown ? (picked === q.a ? 'Đúng.' : `Sai. Đáp án: ${L[q.a]}. ${esc(q.o[q.a])}`) : ''}</div>`;
  else h += `<div class="msg ok">${shown ? `Đáp án: ${L[q.a]}. ${esc(q.o[q.a])}` : ''}</div>`;
  if (shown && q.note.length) h += `<div class="note">${q.note.map(esc).join('<br>')}</div>`;
  h += `<div class="nav"><button onclick="go(-1)" ${st.i ? '' : 'disabled'}>← Trước</button>` +
    (st.mode === 'flip' ? `<button onclick="flip()">${shown ? 'Ẩn đáp án' : 'Hiện đáp án'}</button>` : '') +
    `<button class="next" onclick="go(1)">Sau →</button></div>`;
  c.innerHTML = h;
}
function pick(k) { const q = byN(st.order[st.i]); if (st.mode !== 'quiz' || q.n in st.ans) return; st.ans[q.n] = k; save(); render(); }
function flip() { const n = st.order[st.i]; st.flip[n] = !st.flip[n]; save(); render(); }
function go(d) { st.i = Math.max(0, Math.min(st.order.length, st.i + d)); save(); render(); }
[[47, 'Chương 4–7'], [13, 'Chương 1–3'], [0, 'Tất cả'], [4, 'Ch.4 Đảng'], [5, 'Ch.5 Nhà nước'], [6, 'Ch.6 Đoàn kết'], [7, 'Ch.7 Văn hóa–Đạo đức–Con người']].forEach(([ch, t]) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.dataset.ch = ch;
  b.textContent = `${t} (${ALL.filter(q => inCh(q, ch)).length})`;
  b.onclick = () => { st.ch = ch; start(pool(), false); };
  $('chips').appendChild(b);
});
$('shuf').onclick = () => start(pool(), true);
$('reset').onclick = () => start(pool(), false);
$('mode').onclick = () => { st.mode = st.mode === 'quiz' ? 'flip' : 'quiz'; save(); render(); };
$('wrong').onclick = () => start(st.order.filter(k => k in st.ans && st.ans[k] !== byN(k).a), true);
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '4') pick(+k - 1);
  else if (k.length === 1 && 'abcd'.includes(k)) pick('abcd'.indexOf(k));
  else if (k === 'enter' || k === 'arrowright') go(1);
  else if (k === 'arrowleft') go(-1);
  else if (k === ' ' && st.mode === 'flip') { e.preventDefault(); flip(); }
});
if (!st.order.length) start(pool(), false); else render();
</script>
